/* Operation Lametta · Farbwelt nur aus der Union-Investment-Palette
   UI-Blau #00358E · UI-Grün #43B02A · Grau #C3C3C3 · Hellblau #1386DD
   Türkis #008D92 · Violett #873FD5 · Gelb #FED210 · Gelbgrün #BAD71C · dazu Weiß */
:root {
  --ui-blau: #00358E; --ui-gruen: #43B02A; --grau: #C3C3C3; --hellblau: #1386DD;
  --tuerkis: #008D92; --violett: #873FD5; --gelb: #FED210; --gelbgruen: #BAD71C; --weiss: #FFFFFF;
  --bg: #FFFFFF;
  --bg2: rgba(195,195,195,.35);
  --ink: var(--ui-blau);
  --ink-soft: rgba(0,53,142,.72);
  --paper: #FFFFFF;
  --paper-ink: var(--ui-blau);
  --paper-line: rgba(195,195,195,.6);
  --lamp: var(--gelb);
  --signal: var(--violett);
  --ok: var(--ui-gruen);
  --uv: var(--violett);
  --shadow: rgba(0,53,142,.16);
  --serif: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.5; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 0 0 40px; }

/* Kopf: blaue Leiste mit Logo */
header { display: flex; align-items: center; gap: 12px; background: var(--ui-blau); color: #fff; padding: 14px 18px; }
.logo { width: 44px; height: 44px; flex: none; background: #fff; border-radius: 8px; padding: 5px; display: grid; place-items: center; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.head-txt { flex: 1; min-width: 0; }
.head-txt h1 { font-weight: 700; font-size: 19px; line-height: 1.15; margin: 0; letter-spacing: -.005em; color: #fff; }
.head-txt .team { font-size: 13px; color: rgba(255,255,255,.85); }
.team .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--grau); margin-right: 6px; vertical-align: 0; box-shadow: 0 0 0 2px #fff; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; color: var(--gelb); }
main, footer, .progress { margin-left: 18px; margin-right: 18px; }

.progress { display: flex; gap: 6px; margin-top: 14px; margin-bottom: 16px; }
.progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--bg2); position: relative; overflow: hidden; }
.progress span.done { background: var(--ui-gruen); }
.progress span.now { background: linear-gradient(90deg, var(--gelb) 0 40%, var(--bg2) 40%); }

/* Karte mit Rückseite */
.card-wrap { perspective: 1400px; }
.card { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
.card.flipped { transform: rotateY(180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; }
.front {
  background: var(--paper); color: var(--paper-ink);
  padding: 24px 22px 22px;
  border: 1px solid var(--paper-line); border-top: 5px solid var(--hellblau);
  box-shadow: 0 14px 30px -20px var(--shadow);
}
.front h2 { font-weight: 700; font-size: 26px; line-height: 1.15; margin: 0 0 12px; }
.front p { font-size: 17px; line-height: 1.65; margin: 0 0 14px; }
.front p:last-of-type { margin-bottom: 0; }
.back {
  position: absolute; inset: 0; transform: rotateY(180deg);
  background: var(--ui-blau); color: #fff;
  display: grid; place-items: center; text-align: center; padding: 28px;
  background-image: radial-gradient(60% 50% at 50% 50%, rgba(135,63,213,.55), transparent 72%);
}
.back p { font-style: italic; font-size: 22px; line-height: 1.45; margin: 0;
  text-shadow: 0 0 12px rgba(135,63,213,.95), 0 0 26px rgba(135,63,213,.7); }
.back small { display: block; margin-top: 14px; font-size: 12px; color: var(--gelb); font-style: normal; text-shadow: none; }
.sr-trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.uv-btn {
  margin: 14px 0 0; width: 100%; padding: 13px 16px; border-radius: 8px;
  border: 2px dashed var(--violett); background: #fff; color: var(--violett);
  font: 700 15px var(--sans); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.uv-btn:active, .uv-btn.on { background: var(--violett); color: #fff; border-style: solid; }

/* Schloss */
.lock { margin-top: 26px; text-align: center; }
.shackle { width: 120px; height: 70px; display: block; margin: 0 auto -6px; overflow: visible; }
.shackle path { fill: none; stroke: var(--grau); stroke-width: 12; stroke-linecap: round; transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 96px 70px; }
.lock.open .shackle path { transform: translateY(-14px) rotate(28deg); stroke: var(--ui-gruen); }
.body {
  background: var(--ui-blau);
  background-image: linear-gradient(180deg, rgba(19,134,221,.45), transparent 60%);
  border-radius: 14px; padding: 18px 14px 16px; position: relative;
  box-shadow: 0 16px 30px -18px var(--shadow);
}
.lock-label { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: .02em; }
.lock.shake .body { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.open-btn {
  margin-top: 16px; width: 100%; padding: 15px; border: 0; border-radius: 8px;
  background: var(--gelb); color: var(--ui-blau); font: 800 16px var(--sans); cursor: pointer;
}
.open-btn[disabled] { opacity: .6; cursor: progress; }
.msg { min-height: 48px; margin-top: 12px; font-size: 15px; text-align: center; color: var(--ink-soft); }
.msg.err { color: var(--violett); font-weight: 600; }
.msg.ok { color: var(--ui-gruen); font-weight: 700; }
:focus-visible { outline: 3px solid var(--hellblau); outline-offset: 2px; }

/* Login */
.field { width: 100%; padding: 15px 14px; font: 700 20px var(--sans); letter-spacing: .08em; text-transform: uppercase;
  border: 2px solid var(--grau); border-radius: 8px; background: #fff; color: var(--ui-blau); margin-top: 6px; }
.field:focus { border-color: var(--hellblau); outline: none; }

/* Finale */
.final { text-align: center; padding-top: 10px; }
.q { font-size: 150px; font-weight: 800; line-height: 1; color: var(--ui-blau); margin: 10px 0 18px;
  text-shadow: 0 0 0 transparent, 6px 6px 0 var(--gelb); }
.play { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--gelb); color: var(--ui-blau); text-decoration: none; box-shadow: 0 10px 24px -12px var(--shadow); }
.play svg { width: 30px; height: 30px; margin-left: 5px; }
.play.off { opacity: .35; pointer-events: none; }
.stats { margin: 30px 0 0; text-align: left; background: #fff; color: var(--ui-blau); border-radius: 8px; padding: 18px 20px; border: 1px solid var(--paper-line); border-top: 5px solid var(--ui-gruen); }
.stats h3 { font-weight: 700; font-size: 20px; margin: 0 0 4px; }
.stats p { margin: 0 0 12px; font-size: 14px; color: var(--ink-soft); }
.stats dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: 15px; }
.stats dt { color: var(--ink-soft); }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.stats .flag { color: var(--violett); }

footer { margin-top: 34px; font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer button { background: none; border: 0; color: var(--ink-soft); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .card, .shackle path { transition: none; }
  .lock.shake .body { animation: none; }
}

/* Hilfe-Leiste */
body { padding-bottom: 96px; }
.helpbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
  background: rgba(255,255,255,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--paper-line); z-index: 10; }
.helpbar button { display: block; width: 100%; max-width: 484px; margin: 0 auto; padding: 13px; border-radius: 8px;
  border: 0; background: var(--ui-blau); color: #fff; font: 700 15px var(--sans); cursor: pointer; }
dialog { border: 0; padding: 0; width: min(520px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0;
  border-radius: 14px 14px 0 0; background: #fff; color: var(--ui-blau); }
dialog::backdrop { background: rgba(0,53,142,.55); }
.sheet { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-weight: 700; font-size: 23px; margin: 0 0 4px; }
.sheet .sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 16px; }
.act { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px;
  border-radius: 10px; border: 1px solid var(--paper-line); background: #fff; color: var(--ui-blau); text-decoration: none; font: inherit; cursor: pointer; }
.act .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 18px; color: #fff; }
.act b { display: block; font-size: 16px; }
.act span { font-size: 13px; color: var(--ink-soft); }
.act .cost { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--violett); white-space: nowrap; }
.act.off { opacity: .45; pointer-events: none; }
.close { width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 8px; background: var(--ui-blau); color: #fff; font: 700 15px var(--sans); cursor: pointer; }
.confirm { background: rgba(254,210,16,.18); border: 1px solid var(--gelb); border-radius: 10px; padding: 14px; margin-bottom: 12px; font-size: 15px; color: var(--ui-blau); }
.confirm .row { display: flex; gap: 10px; margin-top: 12px; }
.confirm .row button { flex: 1; padding: 12px; border-radius: 8px; font: 700 14px var(--sans); cursor: pointer; border: 1.5px solid var(--ui-blau); background: #fff; color: var(--ui-blau); }
.confirm .row button.yes { background: var(--violett); border-color: var(--violett); color: #fff; }
.map-box { background: rgba(195,195,195,.18); border-radius: 10px; padding: 8px; }
.map-box svg { width: 100%; height: auto; display: block; }
.map-note { font-style: italic; font-size: 14px; color: var(--ink-soft); text-align: center; margin: 10px 0 12px; }

.score { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); text-align: right; }
.score b { display: block; font-size: 22px; line-height: 1.1; color: var(--gelb); }
.front .kind { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ui-blau); background: rgba(19,134,221,.12); border-radius: 20px; padding: 3px 10px; margin: -4px 0 14px; letter-spacing: .02em; }
.photos { list-style: none; padding: 0; margin: 4px 0 0; counter-reset: ph; }
.photos li { font-size: 16.5px; line-height: 1.5; padding: 9px 0 9px 40px; position: relative; border-top: 1px solid var(--paper-line); }
.photos li::before { counter-increment: ph; content: counter(ph); position: absolute; left: 0; top: 9px; width: 26px; height: 26px; border-radius: 50%;
  background: var(--ui-blau); color: #fff; font: 700 13px var(--sans); display: grid; place-items: center; }
.story { margin: 0 0 18px; padding: 14px 16px 14px 18px; border-left: 4px solid var(--hellblau); background: rgba(19,134,221,.08); border-radius: 0 8px 8px 0; }
.story p { font-style: italic; font-size: 16px !important; line-height: 1.6 !important; margin: 0 0 8px !important; }
.story p:last-child { margin-bottom: 0 !important; }
.pack { margin: 0 0 18px; padding: 12px 16px; border-radius: 8px; background: var(--ui-gruen); color: #fff; font: 600 15px var(--sans); }
.pack b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ui-blau); margin-bottom: 3px; }
.back { padding: 18px 16px; overflow: auto; }
.back p { font-size: 17.5px; line-height: 1.5; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.uv-btn { margin-top: 14px; }
.flinks { display: flex; gap: 14px; flex-wrap: wrap; }
.xnote.ext { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); }
.legal h3 { font: 700 16px var(--sans); margin: 16px 0 4px; }
.legal p, .legal li { font-size: 14.5px; line-height: 1.55; margin: 0 0 6px; }
.legal ul { padding-left: 18px; margin: 4px 0 8px; }
.legal a { color: var(--hellblau); }
.found { display: flex; gap: 8px; margin: 6px 0 2px; }
.found span { width: 44px; height: 52px; border-radius: 8px; display: grid; place-items: center; font: 800 26px var(--sans);
  background: var(--gelb); color: var(--ui-blau); box-shadow: 0 6px 14px -8px var(--shadow); }
.found span.empty { background: transparent; border: 2px dashed var(--grau); color: var(--grau); box-shadow: none; }

.slots { display: flex; justify-content: center; gap: 8px; }
.slot { width: 50px; height: 60px; border: 0; border-radius: 8px; text-align: center; text-transform: uppercase;
  background: #fff; color: var(--ui-blau); font: 800 28px var(--sans); caret-color: var(--hellblau); padding: 0; }
.slot:focus { outline: none; box-shadow: 0 0 0 3px var(--gelb); }
.slot.arrow { display: grid; place-items: center; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 52px); gap: 8px; justify-content: center; margin-top: 14px; }
.pad button { border: 0; border-radius: 8px; background: rgba(255,255,255,.18); color: #fff; font: 700 24px var(--sans); cursor: pointer; }
.pad button:active { background: rgba(255,255,255,.35); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .del { grid-column: 3; grid-row: 1; font-size: 14px; }

.aids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.aids button { padding: 12px 10px; border-radius: 8px; border: 1.5px solid var(--ui-blau); background: #fff; color: var(--ui-blau); font: 700 14px var(--sans); cursor: pointer; }
.aids button small { display: block; font-weight: 700; color: var(--violett); font-size: 12px; }
.aid-box { margin-top: 14px; padding: 14px 16px; border-radius: 8px; background: rgba(254,210,16,.16); color: var(--ui-blau); border-left: 4px solid var(--gelb); font-size: 15px; }
.aid-box b { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
.aid-box.sol { border-left-color: var(--violett); background: rgba(135,63,213,.08); }
.aids button[disabled] { opacity: .4; cursor: default; }
.found-lbl { font: 700 12px var(--sans); color: var(--ink-soft); margin-top: 16px; }
.extra { margin-top: 14px; padding: 14px 16px; border-radius: 8px; background: #fff; color: var(--ui-blau); font-size: 15px; border: 1px solid var(--paper-line); }
.extra b { display: block; font-size: 13px; margin-bottom: 4px; }
.extra p { margin: 0 0 8px; }
.extra.photo { border-left: 5px solid var(--tuerkis); }
.extra.bonus { border-left: 5px solid var(--gelbgruen); }
.extra.bonus.done { border-left-color: var(--ui-gruen); }
.xbtn { display: inline-block; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--ui-blau); color: #fff; font: 700 14px var(--sans); text-decoration: none; cursor: pointer; }
.xnote { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.brow { display: flex; gap: 8px; align-items: center; }
.field.small { font-size: 18px; padding: 10px 12px; margin: 0; flex: 1; }
.slots .slot { flex: 1 1 0; min-width: 0; max-width: 50px; }
.found span { width: auto; flex: 1 1 0; max-width: 44px; }
</style>

    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    msg.className = 'msg err';
    msg.textContent = t ? t.msg : 'Das Schloss bleibt zu. Prüft eure Lösung und versucht es noch einmal.';
    btn.disabled = false; btn.textContent = 'Schloss öffnen';
  };
}


/* ---------- Bonusfrage ---------- */
async function hashOf(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function renderBonus() {
  const box = document.getElementById('bonusBox'); if (!box) return;
  const B = DATA.bonus;
  if (st.bonus) { box.innerHTML = `<div class="extra bonus done"><b>Bonusfrage gelöst</b><p>+${COST.bonus} Punkte für euer Heimspiel.</p></div>`; return; }
  if (st.bonusTries >= 2) { box.innerHTML = `<div class="extra bonus"><b>Bonusfrage</b><p>Zwei Versuche sind aufgebraucht. Kein Abzug, aber auch kein Bonus.</p></div>`; return; }
  box.innerHTML = `<div class="extra bonus"><b>Bonusfrage: ${esc(B.title)} · +${COST.bonus} Punkte</b>
    ${B.text.map(p => `<p>${esc(p)}</p>`).join('')}
    <div class="brow"><input id="bonusIn" class="field small" maxlength="${B.len}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Antwort Bonusfrage">
    <button type="button" class="xbtn" id="bonusGo">Prüfen</button></div>
    <span class="xnote">${2 - st.bonusTries} Versuch${2 - st.bonusTries === 1 ? '' : 'e'} übrig. Falsche Antworten kosten nichts.</span></div>`;
  const go = async () => {
    const v = document.getElementById('bonusIn').value;
    if (norm(v).length !== B.len) return;
    if (await hashOf(v) === B.hash) st.bonus = true; else st.bonusTries++;
    save(); renderBonus();
  };
  document.getElementById('bonusGo').onclick = go;
  document.getElementById('bonusIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- Finale ---------- */
function renderFinal() {
  renderProgress();
  const ms = (st.end || Date.now()) - st.start;
  const url = finalData && finalData.video;
  const nTips = st.tips.filter(Boolean).length, nSols = st.sols.filter(Boolean).length;
  $app.innerHTML = `
    <div class="final">
      <div class="q" aria-hidden="true">?</div>
      <a class="play ${url ? '' : 'off'}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener noreferrer"` : ''} aria-label="Video öffnen, externer Dienst YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
      </a>
      ${url ? '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px">Video öffnen (externer Dienst: YouTube). Beim Öffnen verlasst ihr diese Anwendung.</p>' : '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px">Video-Link fehlt noch. Bitte in der Orga-Version eintragen.</p>'}
      <div class="stats">
        <h3>Eure Akte</h3>
        <p>Zeigt diesen Bildschirm bei eurer Ankunft.</p>
        <dl>
          <dt>Punkte</dt><dd>${points()} von ${COST.start + COST.bonus + COST.tempoMax}</dd>
          <dt>Tempo-Bonus</dt><dd>${tempo() ? '+' + tempo() : 'keiner'} (Richtzeit ${teamOf()?.par || '?'} Min.)</dd>
          <dt>Bonusfrage</dt><dd>${st.bonus ? 'richtig (+' + COST.bonus + ')' : 'nicht gelöst'}</dd>
          <dt>Spielzeit</dt><dd>${Math.floor(ms / 60000)} Min. ${String(Math.floor(ms / 1000) % 60).padStart(2, '0')} Sek.</dd>
          <dt>Fehlversuche</dt><dd>${st.wrong}</dd>
          <dt>Tipps genutzt</dt><dd>${nTips} (−${nTips * COST.tip})</dd>
          <dt>Lösungen genutzt</dt><dd>${nSols} (−${nSols * COST.sol})</dd>
          <dt>Spickzettel</dt><dd class="${st.map ? 'flag' : ''}">${st.map ? 'ja (−' + COST.map + ')' : 'nein'}</dd>
          <dt>KI-Verdacht</dt><dd class="${st.ai ? 'flag' : ''}">${st.ai ? 'ja' : 'nein'}</dd>
        </dl>
      </div>
    </div>`;
  tick();
}

/* ---------- Hilfe & Spickzettel ---------- */

  document.getElementById('closeHelp').onclick = () => dlg.close();
  document.getElementById('mapBtn').onclick = () => {
    if (!stages[0]) { dlg.close(); return; }
    if (st.map) return showMap();
    const box = document.createElement('div'); box.className = 'confirm';
    box.innerHTML = `Die Karte kostet euch <b>${COST.map} Punkte</b>. Das lässt sich nicht rückgängig machen.<div class="row"><button type="button">Abbrechen</button><button type="button" class="yes">Karte öffnen</button></div>`;
    sheet.insertBefore(box, sheet.children[2]);
    const [no, ok] = box.querySelectorAll('button');
    no.onclick = () => box.remove(); ok.onclick = () => { st.map = true; save(); showMap(); }; ok.focus();
  };
}
function showMap() {
  sheet.innerHTML = `<h2 id="helpTitle">Spickzettel</h2><p class="sub">Das Logo ist euer Start. 1 bis 3 sind eure Stationen${stages[0].hasEnd ? ', E ist euer Endpunkt' : ''}. Namen gibt es keine.</p>

    <button class="close" type="button" id="back">Zurück</button>`;
  document.getElementById('back').onclick = helpMenu;
}
document.getElementById('helpOpen').onclick = () => { helpMenu(); dlg.showModal(); };

document.getElementById('privacyBtn').onclick = () => showInfo(PRIVACY);

/* ---------- Start ---------- */
async function boot() {
  renderPoints(); renderTeam();
  if (!st.answers.length) { renderLogin(); tick(); return; }
  $app.innerHTML = '<p class="msg">Lade euren Spielstand…</p>';
  for (let i = 0; i < st.answers.length; i++) {
    const d = await decrypt(i, st.answers[i]);
    if (!d) { st = fresh(); save(); renderLogin(); return; }
    if (i === 4) finalData = d; else stages[i] = d;
  }
  tick();
  finalData ? renderFinal() : renderStage();
}
document.getElementById('reset').onclick = () => {
  if (confirm('Spielstand wirklich löschen? Uhr und Punkte starten dann neu.')) {
    try { localStorage.removeItem(STORE); } catch (e) {}
    st = fresh(); stages = []; finalData = null; renderPoints(); renderTeam(); tick(); renderLogin();
  }
};
boot();
</script>
