   Hintergründe sind abgedunkelte Stufen von UI-Blau. */
/* Hell (Standard) und Dunkel, umschaltbar. Hintergründe im Dunkelmodus sind abgedunkelte Stufen von UI-Blau. */
:root {
  --ui-blau: #00358E; --ui-gruen: #43B02A; --grau: #C3C3C3; --hellblau: #1386DD;
  --tuerkis: #008D92; --violett: #873FD5; --gelb: #FED210; --gelbgruen: #BAD71C; --weiss: #FFFFFF;
  --bg: #FFFFFF; --card: #F3F3F3; --card2: #E9E9E9;
  --text: #00358E; --text2: rgba(0,53,142,.88); --ink-soft: rgba(0,53,142,.66);
  --line: rgba(195,195,195,.6); --bg2: rgba(195,195,195,.45);
  --btn-bg: #00358E; --btn-ink: #FFFFFF; --pill-bg: #00358E; --pill-ink: #FFFFFF;
  --field-bg: #FFFFFF; --field-line: #C3C3C3; --outline: rgba(0,53,142,.45);
  --signal: #873FD5; --ok: #43B02A; --uv: #873FD5; --shadow: rgba(0,53,142,.18);
  --logo-bg: #FFFFFF; --logo-ring: rgba(195,195,195,.8); --nav-bg: #FFFFFF; --now: #00358E;
  --ink: var(--text); --paper: var(--card); --paper-ink: var(--text); --paper-line: var(--line); --lamp: var(--ui-gruen);
  --serif: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #030A1F; --card: #0C1C45; --card2: #12285E;
    --text: #FFFFFF; --text2: rgba(255,255,255,.9); --ink-soft: rgba(255,255,255,.68);
    --line: rgba(195,195,195,.16); --bg2: rgba(195,195,195,.18);
    --btn-bg: #FFFFFF; --btn-ink: #00358E; --field-bg: #030A1F; --field-line: rgba(195,195,195,.35); --outline: rgba(255,255,255,.45);
    --signal: #B07DF0; --shadow: rgba(0,0,0,.45); --logo-ring: transparent; --nav-bg: #0C1C45; --now: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #030A1F; --card: #0C1C45; --card2: #12285E;
  --text: #FFFFFF; --text2: rgba(255,255,255,.9); --ink-soft: rgba(255,255,255,.68);
  --line: rgba(195,195,195,.16); --bg2: rgba(195,195,195,.18);
  --btn-bg: #FFFFFF; --btn-ink: #00358E; --field-bg: #030A1F; --field-line: rgba(195,195,195,.35); --outline: rgba(255,255,255,.45);
  --signal: #B07DF0; --shadow: rgba(0,0,0,.45); --logo-ring: transparent; --nav-bg: #0C1C45; --now: #FFFFFF;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 16px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 0 40px; }

/* Kopf wie im Depot-Dashboard: Pill links, große Zahl in der Mitte */
header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 18px 18px 6px; }
.logo { width: 42px; height: 42px; background: var(--logo-bg); box-shadow: 0 0 0 1px var(--logo-ring); border-radius: 50%; padding: 7px; display: grid; place-items: center; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.head-txt { min-width: 0; }
.head-txt h1 { font-weight: 700; font-size: 17px; line-height: 1.2; margin: 0; color: var(--text); }
.head-txt .team { display: inline-flex; align-items: center; margin-top: 4px; font-size: 13px; color: var(--pill-ink); background: var(--pill-bg); border-radius: 20px; padding: 3px 11px; }
.team .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--grau); margin-right: 7px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ui-gruen); margin-left: 4px; }
main, footer, .progress { margin-left: 18px; margin-right: 18px; }

.progress { display: flex; gap: 6px; margin-top: 14px; margin-bottom: 18px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--bg2); position: relative; overflow: hidden; }
.progress span.done { background: var(--ui-gruen); }
.progress span.now { background: linear-gradient(90deg, var(--now) 0 40%, var(--bg2) 40%); }

/* Karte mit Rückseite */
.card-wrap { perspective: 1400px; }
.card { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
.card.flipped { transform: rotateY(180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 4px; }
.front { background: var(--card); color: var(--text); padding: 22px 20px 20px; }
.front h2 { font-weight: 700; font-size: 25px; line-height: 1.2; margin: 0 0 10px; }
.front p { font-size: 17px; line-height: 1.6; margin: 0 0 14px; color: var(--text2); }
.front p:last-of-type { margin-bottom: 0; }
.back {
  position: absolute; inset: 0; transform: rotateY(180deg); background: var(--ui-blau); color: #fff;
  display: grid; place-items: center; text-align: center; padding: 28px;
  background-image: radial-gradient(60% 50% at 50% 50%, rgba(135,63,213,.6), transparent 72%);
}
.back p { font-style: italic; font-size: 22px; line-height: 1.45; margin: 0; color: #fff;
  text-shadow: 0 0 12px rgba(135,63,213,.95), 0 0 26px rgba(135,63,213,.7); }
.back small { display: block; margin-top: 14px; font-size: 12px; color: var(--gelbgruen); font-style: normal; text-shadow: none; }
.sr-trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.uv-btn {
  margin: 14px 0 0; width: 100%; padding: 13px 16px; border-radius: 30px;
  border: 2px dashed var(--violett); background: transparent; color: var(--violett);
  font: 700 15px var(--sans); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.uv-btn:active, .uv-btn.on { background: var(--violett); color: #fff; border-style: solid; }

/* Schloss */
.lock { margin-top: 26px; text-align: center; }
.shackle { width: 120px; height: 70px; display: block; margin: 0 auto -6px; overflow: visible; }
.shackle path { fill: none; stroke: var(--grau); stroke-width: 12; stroke-linecap: round; transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 96px 70px; }
.lock.open .shackle path { transform: translateY(-14px) rotate(28deg); stroke: var(--ui-gruen); }
.body { background: var(--card2); border-radius: 16px; padding: 18px 14px 16px; position: relative; border: 1px solid var(--line); }
.lock-label { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 12px; letter-spacing: .02em; }
.lock.shake .body { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.open-btn { margin-top: 16px; width: 100%; padding: 15px; border: 0; border-radius: 30px; background: var(--btn-bg); color: var(--btn-ink); font: 800 16px var(--sans); cursor: pointer; }
.open-btn[disabled] { opacity: .6; cursor: progress; }
.msg { min-height: 48px; margin-top: 12px; font-size: 15px; text-align: center; color: var(--ink-soft); }
.msg.err { color: var(--signal); font-weight: 600; }
.msg.ok { color: var(--ui-gruen); font-weight: 700; }
:focus-visible { outline: 3px solid var(--ui-gruen); outline-offset: 2px; }

/* Login */
.field { width: 100%; padding: 15px 14px; font: 700 20px var(--sans); letter-spacing: .08em; text-transform: uppercase;
  border: 1.5px solid var(--field-line); border-radius: 10px; background: var(--field-bg); color: var(--text); margin-top: 6px; }
.field:focus { border-color: var(--ui-gruen); outline: none; }

/* Finale */
.final { text-align: center; padding-top: 10px; }
.q { font-size: 150px; font-weight: 800; line-height: 1; color: var(--text); margin: 10px 0 18px; text-shadow: 6px 6px 0 var(--ui-gruen); }
.play { display: inline-grid; place-items: center; width: 86px; height: 86px; border-radius: 50%; background: var(--btn-bg); color: var(--btn-ink); text-decoration: none; box-shadow: 0 10px 26px -10px var(--shadow); }
.play svg { width: 30px; height: 30px; margin-left: 5px; }
.play.off { opacity: .35; pointer-events: none; }
.stats { margin: 30px 0 0; text-align: left; background: var(--card); color: var(--text); border-radius: 4px; padding: 18px 20px; }
.stats h3 { font-weight: 700; font-size: 20px; margin: 0 0 4px; }
.stats p { margin: 0 0 12px; font-size: 14px; color: var(--ink-soft); }
.stats dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: 15px; }
.stats dt { color: var(--ink-soft); }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.stats .flag { color: var(--signal); }

footer { margin-top: 34px; font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer button { background: none; border: 0; color: var(--ink-soft); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) { .card, .shackle path { transition: none; } .lock.shake .body { animation: none; } }

/* Untere Leiste wie die Navigation der App */
body { padding-bottom: 104px; }
.helpbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--nav-bg); border-top: 1px solid var(--line); z-index: 10; }
.helpbar button { display: block; width: 100%; max-width: 484px; margin: 0 auto; padding: 13px; border-radius: 30px;
  border: 0; background: var(--ui-blau); color: #fff; font: 700 15px var(--sans); cursor: pointer; box-shadow: inset 0 -3px 0 var(--ui-gruen); }
dialog { border: 0; padding: 0; width: min(520px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0;
  border-radius: 18px 18px 0 0; background: var(--bg); color: var(--text); }
dialog::backdrop { background: rgba(3,10,31,.75); }
.sheet { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-weight: 700; font-size: 22px; margin: 0 0 4px; }
.sheet .sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 16px; }
.act { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px;
  border-radius: 4px; border: 0; background: var(--card); color: var(--text); text-decoration: none; font: inherit; cursor: pointer; }
.act .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 18px; color: #fff; }
.act b { display: block; font-size: 16px; }
.act span { font-size: 13px; color: var(--ink-soft); }
.act .cost { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--signal); white-space: nowrap; }
.act.off { opacity: .45; pointer-events: none; }
.close { width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 30px; background: var(--btn-bg); color: var(--btn-ink); font: 700 15px var(--sans); cursor: pointer; }
.confirm { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 12px; font-size: 15px; color: var(--text); text-align: left; }
.confirm .row { display: flex; gap: 10px; margin-top: 12px; }
.confirm .row button { flex: 1; padding: 12px; border-radius: 30px; font: 700 14px var(--sans); cursor: pointer; border: 1.5px solid var(--outline); background: transparent; color: var(--text); }
.confirm .row button.yes { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-ink); }
.map-box { background: #fff; border-radius: 8px; padding: 8px; }
.map-box svg { width: 100%; height: auto; display: block; }
.map-note { font-style: italic; font-size: 14px; color: var(--ink-soft); text-align: center; margin: 10px 0 12px; }
.signoff { text-align:center; margin:4px 0 6px; padding:16px 14px; border-top:1px solid var(--line); }
.signoff p { margin:0 0 4px; font-size:15px; opacity:.85; }
.signoff b { display:block; font-size:16px; color:var(--ui-gruen); }
.signoff span { display:block; margin-top:4px; font-size:14.5px; opacity:.85; }
.toast-wrap { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(3,10,31,.55); opacity:0; transition:opacity .25s; }
.toast-wrap.in { opacity:1; }
.toast { width:100%; max-width:380px; background:var(--card); color:var(--text); border-radius:20px; padding:24px 20px 20px; text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.35); transform:translateY(16px) scale(.97); transition:transform .25s; }
.toast-wrap.in .toast { transform:none; }
.toast-star { font-size:30px; color:var(--ui-gruen); line-height:1; margin-bottom:8px; }
.toast h2 { font-size:21px; margin:0 0 8px; }
.toast-team { margin:0 0 4px; font-size:15px; }
.toast-team i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.toast .signoff { margin:8px 0 16px; padding:12px 0 0; }
.toast .open-btn { width:100%; }
@media (prefers-reduced-motion: reduce) { .toast-wrap, .toast { transition:none; } }
.toast { padding-top:16px; }
.toast-art { display:block; width:100%; max-width:300px; height:auto; margin:0 auto 6px; }
.toast-art .sky { color:var(--text); opacity:.16; }
.toast-art .star { transform-origin:150px 20px; animation:twinkle 2.4s ease-in-out infinite; }
.toast-art .spark circle { animation:twinkle 1.8s ease-in-out infinite; }
.toast-art .spark circle:nth-child(2) { animation-delay:.5s; } .toast-art .spark circle:nth-child(3) { animation-delay:1s; } .toast-art .spark circle:nth-child(4) { animation-delay:1.3s; }
@keyframes twinkle { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.45; transform:scale(.9); } }
.signoff .names { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:10px; opacity:1; }
.signoff .names em { font-style:normal; font-weight:700; font-size:13.5px; padding:4px 11px; border-radius:999px; }
@media (prefers-reduced-motion: reduce) { .toast-art .star, .toast-art .spark circle { animation:none; } }

/* Weihnachts-Deko: Wasserzeichen je Seite und leiser Schneefall */
.front, .final .stats { position:relative; isolation:isolate; }
body { background:transparent; }
.deco::after { content:''; position:absolute; z-index:-1; right:10px; bottom:10px; width:118px; height:118px; background:var(--deco-c); opacity:var(--deco-o,.10); -webkit-mask:var(--deco-i) center/contain no-repeat; mask:var(--deco-i) center/contain no-repeat; pointer-events:none; transform:rotate(-10deg); }
.deco-tree { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M24%203l-9%2013h5l-8%2011h6L8%2039h32l-10-12h6l-8-11h5z%22/%3E%3Crect%20x%3D%2221%22%20y%3D%2239%22%20width%3D%226%22%20height%3D%227%22%20rx%3D%221%22/%3E%3C/svg%3E"); --deco-c:#43B02A; --deco-o:.11; }
.deco-flake { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M24%204v40M6.7%2014l34.6%2020M6.7%2034l34.6-20%22/%3E%3Cpath%20d%3D%22M18%208l6%205%206-5M18%2040l6-5%206%205M7%2021l8-1-3-7M41%2027l-8%201%203%207M7%2027l8%201-3%207M41%2021l-8-1%203-7%22/%3E%3C/g%3E%3C/svg%3E"); --deco-c:#1386DD; --deco-o:.13; }
.deco-ball { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20x%3D%2220%22%20y%3D%224%22%20width%3D%228%22%20height%3D%226%22%20rx%3D%221.5%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2228%22%20r%3D%2217%22/%3E%3C/svg%3E"); --deco-c:#873FD5; --deco-o:.10; }
.deco-gift { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20x%3D%226%22%20y%3D%2218%22%20width%3D%2236%22%20height%3D%2210%22%20rx%3D%222%22/%3E%3Crect%20x%3D%229%22%20y%3D%2228%22%20width%3D%2230%22%20height%3D%2217%22%20rx%3D%222%22/%3E%3Cpath%20d%3D%22M24%2018c-4-10-14-10-12-3%201%203%207%203%2012%203zm0%200c4-10%2014-10%2012-3-1%203-7%203-12%203z%22/%3E%3C/svg%3E"); --deco-c:#008D92; --deco-o:.11; }
.deco-star { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M24%203l6.2%2013.3%2014.6%201.8-10.8%2010%202.9%2014.4L24%2035.3%2011.1%2042.5%2014%2028.1%203.2%2018.1l14.6-1.8z%22/%3E%3C/svg%3E"); --deco-c:#FED210; --deco-o:.30; }
.deco-bell { --deco-i:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M24%205c-8%200-13%206-13%2014v9l-5%208h36l-5-8v-9c0-8-5-14-13-14z%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2241%22%20r%3D%224.5%22/%3E%3C/svg%3E"); --deco-c:#43B02A; --deco-o:.11; }
:root[data-theme=dark] .deco::after { opacity:calc(var(--deco-o,.10) + .05); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) .deco::after { opacity:calc(var(--deco-o,.10) + .05); } }
.snow { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.snow i { position:absolute; top:-30px; width:var(--s); height:var(--s); background:#1386DD; opacity:.22; -webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M24%204v40M6.7%2014l34.6%2020M6.7%2034l34.6-20%22/%3E%3Cpath%20d%3D%22M18%208l6%205%206-5M18%2040l6-5%206%205M7%2021l8-1-3-7M41%2027l-8%201%203%207M7%2027l8%201-3%207M41%2021l-8-1%203-7%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat; mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M24%204v40M6.7%2014l34.6%2020M6.7%2034l34.6-20%22/%3E%3Cpath%20d%3D%22M18%208l6%205%206-5M18%2040l6-5%206%205M7%2021l8-1-3-7M41%2027l-8%201%203%207M7%2027l8%201-3%207M41%2021l-8-1%203-7%22/%3E%3C/g%3E%3C/svg%3E") center/contain no-repeat; animation:fall var(--d) linear var(--w) infinite; }
@keyframes fall { from { transform:translateY(-40px) rotate(0); } to { transform:translateY(110vh) rotate(160deg); } }
@media (prefers-reduced-motion: reduce) { .snow i { animation:none; top:var(--y); } }
/* Lametta-Regen beim Öffnen eines Schlosses */
.rain { position:fixed; inset:0; z-index:60; pointer-events:none; overflow:hidden; }
.rain i { position:absolute; top:-40px; width:3px; border-radius:2px; box-shadow:0 0 4px rgba(254,210,16,.35); animation:tinsel var(--d) cubic-bezier(.3,.2,.6,1) var(--w) forwards; }
@keyframes tinsel { 0% { transform:translate(0,0) rotate(0); opacity:1; } 80% { opacity:1; } 100% { transform:translate(var(--x),105vh) rotate(var(--r)); opacity:0; } }
/* Weihnachtsmann im Finale */
.santa-box { display:flex; align-items:flex-end; gap:6px; margin:22px 0 4px; text-align:left; }
.santa { flex:0 0 46%; width:46%; height:auto; color:var(--text); }
.santa .tinsel { transform-origin:37px 70px; animation:wave 1.6s ease-in-out infinite; }
@keyframes wave { 0%,100% { transform:rotate(-6deg); } 50% { transform:rotate(8deg); } }
.bubble { position:relative; flex:1; background:var(--card); color:var(--text); border-radius:16px; padding:12px 14px; font-size:14.5px; line-height:1.45; margin-bottom:60px; box-shadow:0 6px 18px -10px var(--shadow, rgba(0,0,0,.3)); }
.bubble b { display:block; color:var(--ui-gruen); font-size:16px; }
.bubble::after { content:''; position:absolute; left:-8px; bottom:16px; border:8px solid transparent; border-left:0; border-right-color:var(--card); }
@media (prefers-reduced-motion: reduce) { .santa .tinsel { animation:none; } }
footer a.orga { color: var(--ink-soft); text-decoration: underline; }

/* ================= Super Christmas Party: Pixel-Akzente ================= */
.px { font-family: 'Press Start 2P', var(--sans); font-weight: 700; letter-spacing: .02em; }
header h1 .px { font-size: 17px; line-height: 1.1; color: var(--text); text-transform: uppercase; letter-spacing: .04em; }
header .lvl { font: 600 12px var(--sans); color: var(--ink-soft); margin: 1px 0 2px; } header .lvl i { font-style: normal; color: var(--ui-gruen); }
.score b { font-family: 'Press Start 2P', var(--sans); font-weight: 700; display: inline-block; }
.score .coin-ic { display: inline-block; width: 18px; height: 21px; vertical-align: -3px; margin-right: 4px; }
.score .coin-ic svg, .fscore .coin-ic svg { width: 100%; height: 100%; display: block; }
#points.up { animation: ptup .7s; } #points.down { animation: ptdown .7s; }
@keyframes ptup { 30% { transform: translateY(-6px) scale(1.15); color: var(--ui-gruen); } }
@keyframes ptdown { 30% { transform: translateX(-4px) scale(.92); color: #E5352C; } 60% { transform: translateX(4px); } }
.snd { display: block; margin: 4px 0 0 auto; font: 700 11.5px 'Press Start 2P', var(--sans); padding: 3px 8px; border-radius: 6px; border: 1.5px solid var(--outline); background: transparent; color: var(--text); cursor: pointer; }
.snd[aria-pressed="true"] { background: var(--ui-gruen); border-color: var(--ui-gruen); color: #fff; }

/* Weltkarte */
.world { margin: 6px 0 12px; }
.wtrack { display: flex; align-items: flex-end; justify-content: space-between; gap: 2px; padding: 8px 8px 0; background: var(--card); border-radius: 10px 10px 0 0; position: relative; }
.world::after { content: ''; display: block; height: 10px; border-radius: 0 0 10px 10px;
  background: linear-gradient(#fff 0 3px, transparent 3px), repeating-linear-gradient(90deg, #8C5626 0 14px, #6B3F18 14px 16px); }
.wn { position: relative; display: flex; flex-direction: column; align-items: center; flex: none; width: 44px; }
.wn .ws { width: 30px; height: 30px; display: block; } .wn .ws svg { width: 100%; height: 100%; display: block; }
.wn.start .ws, .wn.goal .ws { width: 26px; height: 26px; margin-bottom: 4px; }
.wn small { font: 700 10.5px 'Press Start 2P', var(--sans); color: var(--ink-soft); margin: 2px 0 4px; }
.wn.got small { color: var(--ui-gruen); } .wn.cur small { color: var(--text); }
.wn.cur .ws { animation: bob 1.2s ease-in-out infinite; }
.wn .me { position: absolute; top: -18px; right: 0; width: 16px; height: 16px; } .wn .me svg { width: 100%; height: 100%; }
.wn.sparkle .ws { animation: sparkle .6s; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes sparkle { 40% { transform: scale(1.5) rotate(20deg); filter: drop-shadow(0 0 6px #FED210); } }
.wpath { flex: 1; height: 0; border-top: 3px dotted var(--outline); margin-bottom: 28px; min-width: 6px; } .wpath.got { border-top-color: var(--ui-gruen); border-top-style: solid; }
.wcount { font: 700 12px 'Press Start 2P', var(--sans); color: #C99700; text-align: right; margin-top: 4px; letter-spacing: .1em; }
.wcount span { color: var(--ink-soft); letter-spacing: 0; margin-left: 4px; }

/* Karten: Pixel-Plattform unten, Welt-Etikett */
.front .plat { position: relative; height: 14px; margin: 18px -20px -20px; background: linear-gradient(#fff 0 4px, transparent 4px), repeating-linear-gradient(90deg, #8C5626 0 14px, #6B3F18 14px 16px); border-radius: 0 0 4px 4px; }
.final .stats .plat { position: relative; height: 12px; margin-top: 14px; background: linear-gradient(#fff 0 4px, transparent 4px), repeating-linear-gradient(90deg, #8C5626 0 14px, #6B3F18 14px 16px); border-radius: 3px; }
.plat .deco-ic { position: absolute; right: 14px; bottom: 16px; width: 26px; height: 26px; animation: bob 1.6s ease-in-out infinite; } .plat .deco-ic svg { width: 100%; height: 100%; }
.deco::after { display: none !important; }
.kind .wl { background: #FED210; color: #00358E; border-radius: 4px; padding: 0 6px; margin-right: 6px; font-size: 12.5px; }
.front .lv { display: inline-block; font-size: 13px; background: #FED210; color: #00358E; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
.front .hero { display: flex; gap: 6px; margin: 4px 0 12px !important; } .front .hero svg { width: 30px; height: 30px; }
.front h2 { font-family: 'Press Start 2P', var(--sans); letter-spacing: .01em; }

/* Schneefall als Pixel-Flocken */
.snow i { -webkit-mask: none !important; mask: none !important; background: #FFFFFF !important; opacity: .55 !important; width: var(--s) !important; height: var(--s) !important; box-shadow: 0 0 0 1px rgba(19,134,221,.25); }
:root:not([data-theme="dark"]) .snow i { background: #1386DD !important; opacity: .18 !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .snow i { background: #FFFFFF !important; opacity: .5 !important; } }

/* Fragezeichen-Block (Starterpaket) */
.qbox { display: flex; gap: 14px; align-items: center; margin: 0 0 18px; padding: 12px 14px; border-radius: 6px; background: var(--ui-blau); color: #fff; border-left: 3px solid #FED210; }
.qbtn { position: relative; flex: none; width: 56px; height: 56px; padding: 0; border: 0; background: none; cursor: pointer; }
.qbtn .qb { display: block; width: 56px; height: 56px; } .qbtn .qb svg { width: 100%; height: 100%; }
.qbtn .qg { position: absolute; left: 10px; top: 4px; width: 36px; height: 30px; opacity: 0; } .qbtn .qg svg { width: 100%; height: 100%; }
.qbox:not(.hit) .qb { animation: qpulse 1.4s ease-in-out infinite; }
@keyframes qpulse { 50% { transform: translateY(-4px); filter: drop-shadow(0 0 6px #FED210); } }
.qbox.hit .qg { opacity: 1; top: -30px; }
.qbox.pop .qb { animation: bumpb .3s; } .qbox.pop .qg { animation: giftup .7s cubic-bezier(.2,1.4,.4,1); }
@keyframes bumpb { 50% { transform: translateY(-10px); } } @keyframes giftup { from { top: 4px; opacity: 0; } }
.qtxt b { display: block; font: 700 13px 'Press Start 2P', var(--sans); color: #FED210; letter-spacing: .06em; text-transform: uppercase; }
.qtxt span { font: 600 15px var(--sans); }

/* Effekt-Ebenen */
.fx { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.fx svg { width: 100%; height: 100%; display: block; }
.float { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); font: 700 42px 'Press Start 2P', var(--sans); text-shadow: 3px 3px 0 #00358E; animation: floatup 1.8s ease-out forwards; white-space: nowrap; }
.float.plus { color: #43B02A; } .float.minus { color: #E5352C; } .float.top { top: 30%; font-size: 28px; color: #FED210; }
@keyframes floatup { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -90px) scale(1); } }
.fx.rm .float { animation: none; opacity: 1; background: var(--card); padding: 8px 14px; border-radius: 8px; font-size: 22px; text-shadow: none; }
.gain .blk { position: absolute; left: calc(50% - 32px); top: 58%; width: 64px; height: 64px; }
.gain .blk.bump { animation: bumpb .3s .1s; }
.gain .mush { position: absolute; left: calc(50% - 30px); top: 58%; width: 60px; height: 52px; animation: mushup 1.8s ease-out forwards; z-index: -1; }
@keyframes mushup { 0% { transform: translateY(0); } 30% { transform: translateY(-62px); } 60% { transform: translate(60px, -70px); } 100% { transform: translate(140px, 40px); opacity: 0; } }
.gain .coinpop { position: absolute; left: calc(50% - 14px); top: 58%; width: 28px; height: 32px; animation: coinpop .9s ease-out forwards; z-index: -1; }
@keyframes coinpop { 50% { transform: translateY(-110px); } 100% { transform: translateY(-60px); opacity: 0; } }
.loss .peel { position: absolute; left: calc(50% - 28px); top: -70px; width: 56px; height: 56px; animation: peel 1.2s ease-in forwards; }
@keyframes peel { 60% { transform: translateY(calc(50vh + 50px)) rotate(200deg); } 100% { transform: translateY(calc(50vh + 40px)) rotate(220deg); opacity: .0; } }
.wrap.slip { animation: slip .9s cubic-bezier(.3,.6,.4,1); } @keyframes slip { 30% { transform: translateX(40px) rotate(4deg); } 60% { transform: translateX(-20px) rotate(-2deg); } }
.wrap.shake { animation: shk .45s linear 2; } @keyframes shk { 25% { transform: translate(6px,-3px); } 50% { transform: translate(-6px,3px); } 75% { transform: translate(4px,4px); } }
.loss .shellfly { position: absolute; left: -80px; top: 44%; width: 64px; height: 48px; animation: shell .8s cubic-bezier(.5,0,1,1) forwards; }
@keyframes shell { to { transform: translateX(calc(50vw + 40px)) rotate(720deg); } }
.loss .hitflash { position: absolute; inset: 0; background: #fff; opacity: 0; animation: hitf .3s .65s; }
@keyframes hitf { 50% { opacity: .55; } }
.loss .flash { position: absolute; inset: 0; background: #FFF6B0; animation: flash .6s steps(2) 1; opacity: 0; }
@keyframes flash { 0%, 40% { opacity: .9; } 20%, 60% { opacity: 0; } 100% { opacity: 0; } }
.loss .boltfall { position: absolute; left: calc(50% - 40px); top: -10px; width: 80px; height: 94px; animation: bolt .5s steps(3) forwards; filter: drop-shadow(0 0 12px #FED210); }
@keyframes bolt { from { transform: translateY(-120px); } to { transform: translateY(32vh); } }
.bonus .cannon { position: absolute; left: 6%; bottom: 18%; width: 96px; height: 84px; transform: scaleX(-1); animation: cannonin .4s ease-out; }
@keyframes cannonin { from { transform: scaleX(-1) translateX(80px); opacity: 0; } }
.bonus .puffx { position: absolute; left: calc(6% + 92px); bottom: calc(18% + 50px); width: 50px; height: 36px; opacity: 0; animation: puff .5s .38s; }
@keyframes puff { 30% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1.8); } }
.bonus .shot { position: absolute; left: calc(6% + 70px); bottom: calc(18% + 46px); width: 40px; height: 40px; opacity: 0; animation: shot 1.3s .4s cubic-bezier(.2,.6,.5,1) forwards; }
@keyframes shot { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 1; transform: translate(80vw, -45vh) rotate(720deg); } }
.bonus .banner { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); text-align: center; animation: banner 2.4s steps(1) forwards, bannerin .5s .5s cubic-bezier(.2,1.6,.4,1) both; }
.bonus .banner span { display: block; font: 700 56px 'Press Start 2P', var(--sans); color: #FED210; text-shadow: 4px 4px 0 #00358E, -2px -2px 0 #fff; letter-spacing: .06em; }
.bonus .banner small { font: 700 20px 'Press Start 2P', var(--sans); color: #43B02A; text-shadow: 2px 2px 0 #00358E; }
@keyframes bannerin { from { transform: translateX(-50%) scale(0); } }
.starfx { background: radial-gradient(circle at 50% 45%, rgba(254,210,16,.25), transparent 60%); }
.starfx .bigstar { position: absolute; left: calc(50% - 60px); top: calc(45% - 60px); width: 120px; height: 120px; animation: starin .9s cubic-bezier(.2,1.5,.4,1); filter: drop-shadow(0 0 16px #FED210); }
@keyframes starin { from { transform: scale(0) rotate(-180deg); } }
.glit { position: fixed; width: 6px; height: 6px; background: #FED210; animation: glit .6s ease-out forwards; }
@keyframes glit { from { transform: rotate(var(--a)) translateX(0); opacity: 1; } to { transform: rotate(var(--a)) translateX(34px); opacity: 0; } }
.say { pointer-events: auto; display: flex; align-items: flex-end; justify-content: center; padding: 0 14px 120px; background: rgba(3,10,31,.25); }

/* Sprechblasen und Abzeichen */
.sb { display: flex; gap: 10px; align-items: flex-start; background: #fff; color: #00358E; border: 3px solid #00358E; border-radius: 4px; padding: 10px 12px; box-shadow: 4px 4px 0 #00358E; max-width: 420px; text-align: left; animation: sbin .45s cubic-bezier(.2,1.4,.4,1) both; }
.sb b { font: 700 14px 'Press Start 2P', var(--sans); display: block; } .sb p { margin: 2px 0 0 !important; font: 600 15px/1.4 var(--sans) !important; color: #00358E !important; }
@keyframes sbin { from { opacity: 0; transform: translateY(16px) scale(.92); } }
.bdg { flex: none; width: 38px; height: 38px; display: grid; place-items: center; font: 700 22px 'Press Start 2P', var(--sans); border: 3px solid #0C1C45; border-radius: 6px; }
.bdg.bowser { background: #873FD5; color: #FED210; } .bdg.wario { background: #FED210; color: #873FD5; }
.bdg.kom { background: #fff; padding: 3px; } .bdg.kom img { width: 100%; height: 100%; object-fit: contain; }
.sb.bowser, .sb.wario { border-color: #873FD5; box-shadow: 4px 4px 0 #873FD5; }

/* Intro */
.intro { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(3,10,31,.82); opacity: 0; transition: opacity .25s; overflow-y: auto; }
.intro.in { opacity: 1; }
.ibox { width: 100%; max-width: 440px; background: var(--card); color: var(--text); border-radius: 12px; padding: 18px 16px 16px; border: 3px solid #FED210; box-shadow: 0 0 0 3px #00358E, 0 20px 50px rgba(0,0,0,.45); }
.ihead { text-align: center; margin-bottom: 12px; } .ihead span { font-size: 13px; color: #C99700; letter-spacing: .14em; text-transform: uppercase; }
.ihead h2 { font-size: 30px; margin: 2px 0 6px; } .istars { display: flex; justify-content: center; gap: 6px; } .istars svg { width: 26px; height: 26px; }
.ibubs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; } .ibubs .sb.wario, .ibubs .sb.bowser { margin-left: 22px; }
.ip { font-size: 15px; color: var(--text2); margin: 0 0 10px; }
.linkbtn { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--ink-soft); text-decoration: underline; font: 600 14px var(--sans); cursor: pointer; }
.cast { list-style: none; padding: 0; margin: 0 0 12px; } .cast li { padding: 8px 10px; margin-bottom: 6px; border-radius: 6px; background: var(--card2); font-size: 15.5px; animation: sbin .45s both; }
.cast em { font-style: normal; font-weight: 700; color: var(--ui-gruen); }
.ibox .signoff { border-top: 1px solid var(--line); padding-top: 12px; margin: 6px 0 14px; text-align: center; }
.signoff .names em small { font-weight: 600; opacity: .9; font-size: 11.5px; }
.ibox .open-btn { width: 100%; }

/* Finale */
.final .saved { background: var(--card); border-radius: 12px; padding: 18px 16px; border: 3px solid #FED210; box-shadow: 0 0 0 3px #00358E; }
.final .saved .lvl2 { font-size: 13px; color: #C99700; letter-spacing: .14em; text-transform: uppercase; }
.final .saved h2 { font-size: 36px; margin: 2px 0 8px; color: var(--text); }
.fstars { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; } .fstars svg { width: 36px; height: 36px; animation: bob 1.4s ease-in-out infinite; }
.fstars svg:nth-child(2) { animation-delay: .2s; } .fstars svg:nth-child(3) { animation-delay: .4s; } .fstars svg:nth-child(4) { animation-delay: .6s; }
.final .saved p { font-size: 15.5px; color: var(--text2); margin: 0 0 10px; }
.fscore { display: inline-flex; align-items: center; gap: 8px; background: #00358E; color: #fff; padding: 6px 14px; border-radius: 8px; }
.fscore .coin-ic { width: 22px; height: 26px; } .fscore b { font-size: 30px; color: #FED210; } .fscore small { font-size: 13px; }
.vid { margin: 16px 0; } .vid b { display: block; font: 700 18px 'Press Start 2P', var(--sans); } .vid > span { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 10px; }
.rankbox { background: var(--card); border-radius: 10px; padding: 12px 14px; text-align: left; margin-bottom: 14px; }
.rankbox h3 { margin: 0 0 6px; font-size: 18px; }
.rk { list-style: none; margin: 0; padding: 0; } .rk li { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-top: 1px solid var(--line); font-size: 15px; }
.rk li:first-child { border-top: 0; } .rk .pl { width: 28px; text-align: center; font-weight: 700; } .rk i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.rk .tn { flex: 1; font-weight: 600; } .rk .tn small { color: var(--ink-soft); font-weight: 500; } .rk b { font-size: 20px; }
.rk li.me { background: rgba(254,210,16,.22); border-radius: 6px; } .rk .mut { color: var(--ink-soft); }
.flee .runner { position: absolute; top: 40%; animation: run 2.2s cubic-bezier(.6,0,.9,.6) forwards; }
.flee .runner.w { top: 52%; animation-delay: .25s; }
.flee .runner .bdg { width: 54px; height: 54px; font-size: 30px; animation: hop .25s steps(2) infinite; }
.flee .dust { position: absolute; left: -36px; bottom: 0; width: 34px; height: 24px; opacity: .8; }
@keyframes run { from { left: 40%; } 25% { left: 42%; } to { left: 120%; } }
@keyframes hop { 50% { transform: translateY(-6px) rotate(-8deg); } }
.flee .sb.fleeing { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); width: max-content; max-width: 90vw; }
.fw { background: radial-gradient(circle at 50% 30%, rgba(3,10,31,.35), transparent 70%); }
.fws { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: 0; animation: fws 1.3s ease-out forwards; }
@keyframes fws { 0% { opacity: 1; transform: rotate(var(--a)) translateX(0) scale(.4); } 70% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateX(var(--r)) scale(1) rotate(180deg); } }
@media (prefers-reduced-motion: reduce) { .wn.cur .ws, .plat .deco-ic, .qbox .qb, .fstars svg, .sb, .cast li { animation: none !important; } }
/* Kleine Beschriftungen in Figtree, damit Ziffern lesbar bleiben */
.wn small, .ihead span, .final .saved .lvl2, .front .lv, .kind .wl, .snd, .wcount, .qtxt b, .sb b, .fscore small { font-family: var(--sans) !important; font-weight: 800 !important; }
.wn small { font-size: 10.5px; }
.bdg { font-family: var(--sans) !important; font-weight: 900 !important; }
/* Startseite: eigene Jump'n'Run-Szene */
.stagebox { position: relative; margin: 0 0 14px; border-radius: 10px; overflow: hidden; border: 3px solid #00358E; box-shadow: 4px 4px 0 #00358E; }
.stagebox .scene { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.scene .sky { fill: #5BB0EE; } .scene .nstars { opacity: 0; }
:root[data-theme="dark"] .scene .sky { fill: #0C1C45; } :root[data-theme="dark"] .scene .nstars { opacity: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .scene .sky { fill: #0C1C45; } :root:not([data-theme="light"]) .scene .nstars { opacity: 1; } }
.hud { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; justify-content: space-between; padding: 6px 10px; font: 800 9.5px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: #fff; text-shadow: 1px 1px 0 #00358E; }
.hud span { display: flex; flex-direction: column; align-items: center; } .hud b { font-size: 12px; letter-spacing: .06em; }
.ttl-over { position: absolute; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; display: none; }
.scene .hero { animation: hjump 2.4s steps(1) infinite; }
@keyframes hjump { 0%, 30% { transform: translateY(0); } 34% { transform: translateY(-5px); } 38% { transform: translateY(-11px); } 42% { transform: translateY(-14px); } 50% { transform: translateY(-11px); } 54% { transform: translateY(-5px); } 58%, 100% { transform: translateY(0); } }
.scene .qb1 { animation: qbump 2.4s steps(1) infinite; } @keyframes qbump { 0%, 41% { transform: translateY(0); } 42%, 46% { transform: translateY(-2px); } 47%, 100% { transform: translateY(0); } }
.scene .coinpop { opacity: 0; animation: cpop 2.4s steps(1) infinite; }
@keyframes cpop { 0%, 42% { opacity: 0; transform: translateY(0); } 44% { opacity: 1; transform: translateY(-4px); } 48% { opacity: 1; transform: translateY(-9px); } 52% { opacity: 1; transform: translateY(-12px); } 58%, 100% { opacity: 0; transform: translateY(-12px); } }
.scene .clouds { animation: drift 30s linear infinite alternate; } @keyframes drift { to { transform: translateX(14px); } }
.scene .sstar { animation: bob 1.4s ease-in-out infinite; } .scene .coins { animation: bob 1.8s ease-in-out infinite; }
.scene .nstars rect:nth-child(odd) { animation: twk 1.6s steps(2) infinite; } @keyframes twk { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
/* Ziffern und kleine Großbuchstaben nie in der Pixel-Schrift */
header h1 .px { text-transform: none; font-size: 19px; letter-spacing: .01em; }
.score b, .fscore b, .rk b, .float, .bonus .banner small { font-family: var(--sans) !important; font-weight: 900 !important; }
.login-h { font-family: var(--sans) !important; }
/* Press Start 2P ist breit: Größen anpassen */
.px, .front h2:not(.login-h), .ihead h2, .final .saved h2, .bonus .banner span, .vid b, .rankbox h3 { font-weight: 400 !important; }
header h1 .px { font-size: 11.5px; line-height: 1.4; letter-spacing: 0; }
.front h2:not(.login-h) { font-size: 17px; line-height: 1.45; }
.ihead h2 { font-size: 19px; line-height: 1.4; } .final .saved h2 { font-size: 21px; line-height: 1.4; }
.bonus .banner span { font-size: 34px; } .vid b { font-size: 13px; line-height: 1.5; } .rankbox h3 { font-size: 13px; }
.score b { font-family: 'Press Start 2P', var(--sans) !important; font-weight: 400 !important; font-size: 20px; line-height: 1.3; }
.fscore b { font-family: 'Press Start 2P', var(--sans) !important; font-weight: 400 !important; font-size: 20px; }
.kind .wl, .front .lv { font-family: 'Press Start 2P', var(--sans) !important; font-weight: 400 !important; font-size: 9.5px; padding: 3px 6px; }
.hud { font-family: 'Press Start 2P', var(--sans); font-weight: 400; font-size: 7px; letter-spacing: 0; } .hud b { font-size: 9px; letter-spacing: 0; margin-top: 3px; }
.float.top { font-family: 'Press Start 2P', var(--sans) !important; font-weight: 400 !important; font-size: 16px; }
.front h2:not(.login-h) { font-size: 15px; } .ttl .tts { flex-shrink: 0; }
/* Kart statt Fähnchen, Kart in der Startszene */
.wn .me { top: -17px; right: -6px; width: 26px; height: 19px; }
.ikart { width: 66px; height: 48px; margin: 6px auto 2px; animation: bob .9s ease-in-out infinite; } .ikart svg { width: 100%; height: 100%; }
.ihead h2.px { font-size: 15px; line-height: 1.6; }
.toast-team { text-align: center; margin: 4px 0 6px; font-size: 15px; } .toast-team i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.scene .kart { animation: kdrive 7s linear infinite; }
@keyframes kdrive { 0% { transform: translate(0,0); } 46% { transform: translate(110px,0); } 48% { transform: translate(115px,-3px); } 50% { transform: translate(120px,0); } 100% { transform: translate(250px,0); } }
@media (prefers-reduced-motion: reduce) { .ikart { animation: none; } .scene .kart { transform: translate(90px,0); } }
.scene .mushes svg:nth-child(odd) { animation: bob 1.6s ease-in-out infinite; } .scene .mushes svg:nth-child(even) { animation: bob 1.6s .8s ease-in-out infinite; }
/* Italien: Tricolore-Akzente (grün, weiß, rot) */
:root { --it-g: #009246; --it-w: #FFFFFF; --it-r: #CE2B37; --tri: linear-gradient(90deg, var(--it-g) 0 33.3%, var(--it-w) 33.3% 66.6%, var(--it-r) 66.6%); }
header { position: relative; }
header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; background: var(--tri); border-radius: 2px; box-shadow: 0 0 0 .5px rgba(0,0,0,.08); }
.wpath.got { border-top-color: var(--it-g); }
.wn.got small { color: var(--it-g); }
.ibox { position: relative; overflow: hidden; } .ibox::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--tri); }
.final .saved { position: relative; overflow: hidden; } .final .saved::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--tri); }
.final .saved .lvl2 { color: var(--it-g); }
.stagebox::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--tri); }
.cast em, .signoff b { color: var(--it-g); }
.open-btn { position: relative; }
.kind .wl { background: var(--tri); color: #00358E; text-shadow: 0 0 2px #fff, 0 0 2px #fff; }
.qbox { border-left-color: var(--it-r); }
.cf { position: absolute; top: -12px; width: 7px; height: 12px; border: .5px solid rgba(0,0,0,.15); animation: cff var(--d) cubic-bezier(.3,.2,.6,1) var(--w) forwards; }
@keyframes cff { to { transform: translate(var(--x), 105vh) rotate(540deg); } }
.scene .bunting { animation: sway 3s ease-in-out infinite alternate; transform-origin: 96px 22px; } @keyframes sway { to { transform: translateY(1px); } }
@media (prefers-reduced-motion: reduce) { .cf { display: none; } }
.kind .wl { background: #FED210 !important; text-shadow: none !important; }
.scene .vesuv .smoke rect { animation: smoke 3s ease-in-out infinite; } .scene .vesuv .smoke rect:nth-child(2n) { animation-delay: 1s; } @keyframes smoke { 50% { transform: translate(1px,-2px); opacity: .6; } } :root[data-theme="dark"] .scene .vesuv > polygon:first-child { fill: #3B4A70; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .scene .vesuv > polygon:first-child { fill: #3B4A70; } } @media (prefers-reduced-motion: reduce) { .scene .vesuv .smoke rect { animation: none; } }
/* Video im Finale direkt in der Seite */
.vframe { display: grid; place-items: center; margin: 4px auto 0; width: 100%; max-width: 560px; }
.vframe.on { aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 3px solid #FED210; box-shadow: 0 0 0 3px #00358E; }
.vframe iframe { width: 100%; height: 100%; border: 0; display: block; }
.vframe .play { border: 0; cursor: pointer; }
.vnote { font-size: 13px; color: var(--ink-soft); margin-top: 10px; } .vnote a { color: var(--ui-gruen); }
.kombox { background: var(--card); border-radius: 10px; padding: 12px 14px; text-align: left; margin-bottom: 14px; }
.kombox h3 { margin: 0 0 8px; font-size: 13px; }
.kq { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--line); font-size: 14.5px; line-height: 1.4; } .kq:first-of-type { border-top: 0; }
.kq em { flex: none; font-style: normal; font-weight: 800; font-size: 12px; padding: 2px 9px; border-radius: 20px; }
/* Zwischennachrichten: wegtippen und verpuffen */
.say { background: rgba(3,10,31,.45); padding-bottom: 110px; cursor: pointer; }
.sbok { display: inline-block; margin-top: 10px; font: 800 14px var(--sans); color: #fff; background: #43B02A; border: 0; border-radius: 20px; padding: 7px 14px; box-shadow: 0 3px 0 #2E7D1C; cursor: pointer; }
.sbok:focus-visible { outline: 3px solid #FED210; outline-offset: 2px; }
.sb.poof { animation: sbpoof .35s ease-in forwards; }
@keyframes sbpoof { 40% { transform: scale(1.08); } 100% { transform: scale(.2); opacity: 0; filter: blur(2px); } }
.pf { position: fixed; width: 46px; height: 32px; margin: -16px 0 0 -23px; opacity: 0; animation: pf .55s ease-out forwards; pointer-events: none; }
.pf svg { width: 100%; height: 100%; display: block; }
@keyframes pf { 0% { opacity: 1; transform: scale(.3); } 60% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6); } }
/* Countdown auf der Startseite */
.cdown { margin: -2px 0 14px; padding: 12px 10px 10px; border-radius: 10px; background: #00358E; color: #fff; text-align: center; position: relative; overflow: hidden; border: 3px solid #FED210; }
.cdown::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--tri); }
.cd-t { font: 800 11.5px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: #FED210; margin-bottom: 8px; }
.cd-row { display: flex; justify-content: center; align-items: flex-start; gap: 4px; }
.cd-row span { display: flex; flex-direction: column; align-items: center; min-width: 58px; font: 700 10.5px var(--sans); color: rgba(255,255,255,.75); }
.cd-row b { font: 400 22px 'Press Start 2P', var(--sans); color: #fff; background: #0C1C45; border-radius: 6px; padding: 8px 6px 6px; margin-bottom: 4px; min-width: 56px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }
.cd-row i { font: 400 20px 'Press Start 2P', var(--sans); color: #FED210; padding-top: 10px; font-style: normal; }
.cd-go { font-size: 14px; color: #FED210; padding: 6px 0; }

.score { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; color: var(--ink-soft); text-align: right; }
.score b { display: block; font-size: 30px; line-height: 1.05; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
.front .kind { display: inline-block; font-size: 12.5px; font-weight: 600; color: #fff; background: var(--ui-blau); border-radius: 20px; padding: 3px 11px; margin: 0 0 14px; }
.ttl { display: flex; align-items: flex-start; gap: 10px; }
.ttl h2 { flex: 1; }
.tts { flex: none; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; padding: 7px 12px; border-radius: 20px; border: 1.5px solid var(--outline);
  background: transparent; color: var(--text); font: 700 13px var(--sans); cursor: pointer; }
.tts svg { width: 16px; height: 16px; }
.tts.on { background: var(--ui-gruen); border-color: var(--ui-gruen); color: #fff; }
.photos { list-style: none; padding: 0; margin: 4px 0 0; counter-reset: ph; }
.photos li { font-size: 16.5px; line-height: 1.5; padding: 10px 0 10px 42px; position: relative; border-top: 1px solid var(--line); }
.photos li::before { counter-increment: ph; content: counter(ph); position: absolute; left: 0; top: 10px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--ui-blau); color: #fff; font: 700 13px var(--sans); display: grid; place-items: center; }
.story { margin: 0 0 18px; padding: 14px 16px; border-left: 3px solid var(--hellblau); background: var(--card2); border-radius: 0 4px 4px 0; }
.story p { font-style: italic; font-size: 16px !important; line-height: 1.6 !important; margin: 0 0 8px !important; color: var(--text2) !important; }
.story p:last-child { margin-bottom: 0 !important; }
.pack { margin: 0 0 18px; padding: 12px 16px; border-radius: 4px; background: var(--ui-blau); color: #fff; font: 600 15px var(--sans); border-left: 3px solid var(--ui-gruen); }
.pack b { display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ui-gruen); margin-bottom: 3px; }
.back { padding: 18px 16px; overflow: auto; }
.back p { font-size: 17.5px; line-height: 1.5; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
.uv-btn { margin-top: 14px; }
.ps { font-size: 15px !important; background: var(--card2); border-left: 3px solid var(--ui-gruen); padding: 10px 12px; border-radius: 0 4px 4px 0; }
.tick { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--line); cursor: pointer; font-weight: 600; font-size: 15px; }
.tick input { width: 22px; height: 22px; accent-color: var(--ui-gruen); flex: none; margin: 0; }
.tick em { font-style: normal; color: var(--ui-gruen); font-weight: 700; margin-left: 4px; }
.flinks { display: flex; gap: 14px; flex-wrap: wrap; }
.xnote.ext { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); }
.legal h3 { font: 700 16px var(--sans); margin: 16px 0 4px; }
.legal p, .legal li { font-size: 14.5px; line-height: 1.55; margin: 0 0 6px; color: var(--text2); }
.legal ul { padding-left: 18px; margin: 4px 0 8px; }
.legal a { color: var(--ui-gruen); }
.found { display: flex; gap: 8px; margin: 6px 0 2px; }
.found span { width: 44px; height: 52px; border-radius: 8px; display: grid; place-items: center; font: 800 26px var(--sans); background: var(--ui-gruen); color: #fff; }
.found span.empty { background: transparent; border: 2px dashed rgba(195,195,195,.45); color: rgba(195,195,195,.6); }

.slots { display: flex; justify-content: center; gap: 8px; }
.slot { width: 50px; height: 60px; border: 1.5px solid rgba(195,195,195,.3); border-radius: 10px; text-align: center; text-transform: uppercase;
  background: var(--field-bg); color: var(--text); font: 800 28px var(--sans); caret-color: var(--ui-gruen); padding: 0; }
.slot:focus { outline: none; border-color: var(--ui-gruen); box-shadow: 0 0 0 2px var(--ui-gruen); }
.slot.arrow { display: grid; place-items: center; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 52px); gap: 8px; justify-content: center; margin-top: 14px; }
.pad button { border: 0; border-radius: 10px; background: var(--ui-blau); color: #fff; font: 700 24px var(--sans); cursor: pointer; }
.pad button:active { background: var(--hellblau); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .del { grid-column: 3; grid-row: 1; font-size: 14px; background: transparent; color: var(--text); border: 1.5px solid var(--outline); }

.aids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.aids button { padding: 12px 10px; border-radius: 30px; border: 1.5px solid var(--outline); background: transparent; color: var(--text); font: 700 14px var(--sans); cursor: pointer; }
.aids button small { display: block; font-weight: 700; color: var(--signal); font-size: 12px; }
.aid-box { margin-top: 14px; padding: 14px 16px; border-radius: 4px; background: var(--card); color: var(--text); border-left: 3px solid var(--ui-gruen); font-size: 15px; }
.aid-box b { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 2px; }
.aid-box.sol { border-left-color: var(--violett); }
.aids button[disabled] { opacity: .4; cursor: default; }
.found-lbl { font: 700 12px var(--sans); color: var(--ink-soft); margin-top: 16px; }
.extra { margin-top: 14px; padding: 16px; border-radius: 4px; background: var(--card); color: var(--text); font-size: 15px; }
.extra b { display: block; font-size: 15px; margin-bottom: 6px; }
.extra p { margin: 0 0 10px; color: var(--text2); }
.extra.photo { border-left: 3px solid var(--tuerkis); }
.extra.bonus { border-left: 3px solid var(--gelbgruen); }
.extra.bonus.done { border-left-color: var(--ui-gruen); }
.xbtn { display: inline-block; padding: 11px 16px; border-radius: 30px; border: 0; background: var(--btn-bg); color: var(--btn-ink); font: 700 14px var(--sans); text-decoration: none; cursor: pointer; }
.xnote { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
.brow { display: flex; gap: 8px; align-items: center; }
.field.small { font-size: 18px; padding: 10px 12px; margin: 0; flex: 1; }
.slots .slot { flex: 1 1 0; min-width: 0; max-width: 50px; }
.found span { width: auto; flex: 1 1 0; max-width: 44px; }
</style>
</head>

async function decryptBlob(blob, answer, idx) {
  try {
    const base = await crypto.subtle.importKey('raw', te.encode(norm(answer) + '|' + idx), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: DATA.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const raw = b64(blob);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(td.decode(pt));
  } catch (e) { return null; }
}

async function trap(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
  return (DATA.traps[st.team] || {})[hash] || null;
}

/* ---------- Vorlesen (Sprachausgabe des Geräts) ---------- */
const synth = window.speechSynthesis || null;
const VOICE_KEY = 'lametta-voice';
let deVoice = null, deVoices = [], voicesLoaded = false;
function voiceScore(v) {
  const n = v.name.toLowerCase(); let s = 0;
  if (/natural|neural|online/.test(n)) s += 100;          // z. B. Edge: „Katja Online (Natural)“
  if (/premium|enhanced|erweitert|verbessert/.test(n)) s += 80; // iPhone/Mac: Premium-Stimmen
  if (/google/.test(n)) s += 60;                           // Chrome und Android
  if (/siri/.test(n)) s += 50;
  if (/^de[-_]de/i.test(v.lang)) s += 10;
  if (/hedda|stefan|compact|espeak|katja desktop/.test(n)) s -= 40;
  return s;
}
function pickVoice() {
  if (!synth) return; const all = synth.getVoices(); voicesLoaded = all.length > 0;
  deVoices = all.filter(v => /^de([-_]|$)/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
  let saved = null; try { saved = localStorage.getItem(VOICE_KEY); } catch (e) {}
  deVoice = deVoices.find(v => v.name === saved) || deVoices[0] || null;
  voiceLabel();
}
function voiceLabel() {
  const b = document.getElementById('voiceBtn'); if (!b) return;
  b.hidden = deVoices.length < 2;
  if (deVoice) b.textContent = 'Stimme: ' + deVoice.name.replace(/^(Microsoft|Apple)\s+/i, '').replace(/\s*[-–(].*$/, '');
}
function nextVoice() {
  if (!deVoices.length) return;
  deVoice = deVoices[(deVoices.indexOf(deVoice) + 1) % deVoices.length];
  try { localStorage.setItem(VOICE_KEY, deVoice.name); } catch (e) {}
  voiceLabel(); stopSpeech();
  const u = new SpeechSynthesisUtterance('Hallo, so klinge ich.'); u.lang = deVoice.lang; u.voice = deVoice; synth.speak(u);
}
if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) { synth.onvoiceschanged = pickVoice; } }
const ttsOk = () => !!synth && (!voicesLoaded || !!deVoice);
function stopSpeech() { try { if (synth) synth.cancel(); } catch (e) {} }
function speak(parts, btn) {
  if (!synth) return;
  const off = () => { btn.classList.remove('on'); btn.setAttribute('aria-pressed', 'false'); };
  if (synth.speaking || btn.classList.contains('on')) { stopSpeech(); off(); return; }
  // In Sätze teilen: natürlichere Pausen, und lange Texte brechen nicht ab
  const text = parts.filter(Boolean).map(p => /[.!?:“"]$/.test(p.trim()) ? p.trim() : p.trim() + '.').join(' ');
  const sents = text.match(/[^.!?]+[.!?]+[“"]?\s*|[^.!?]+$/g) || [text];
  const nat = deVoice && voiceScore(deVoice) >= 50;
  sents.forEach((txt, i) => {
    const u = new SpeechSynthesisUtterance(txt.trim());
    u.lang = deVoice ? deVoice.lang : 'de-DE'; if (deVoice) u.voice = deVoice;
    u.rate = nat ? 1.0 : 0.92; u.pitch = 1;
    if (i === sents.length - 1) { u.onend = off; } u.onerror = off;
    synth.speak(u);
  });
  btn.classList.add('on'); btn.setAttribute('aria-pressed', 'true');
}

  const qbtn = document.getElementById('qbtn');
  if (qbtn) qbtn.onclick = () => { if (st.pack) return; st.pack = true; save(); SFX.play('block'); setTimeout(() => SFX.play('power'), 150);

    ...(s.list || []).map((l, i) => `${i + 1}: ${l}`), ...(s.uv && uvSeen ? ['Das Gedicht von Wario', ...s.uv] : [])], ttsBtn);

  // UV-Lampe: gedrückt halten dreht die Karte um
  const uvBtn = document.getElementById('uvBtn');
  if (uvBtn) {
    const card = document.getElementById('uvCard'), back = card.querySelector('.back');
    const on = v => { if (v) uvSeen = true; card.classList.toggle('flipped', v); uvBtn.classList.toggle('on', v); uvBtn.setAttribute('aria-pressed', v); back.setAttribute('aria-hidden', !v); };
    uvBtn.addEventListener('pointerdown', e => { e.preventDefault(); on(true); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => uvBtn.addEventListener(ev, () => on(false)));
    uvBtn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); on(!card.classList.contains('flipped')); } });
    uvBtn.addEventListener('contextmenu', e => e.preventDefault());
  }

  // Eingabe
  let arrows = [];
  const read = () => s.lock.type === 'arrows' ? arrows.join('') : [...document.querySelectorAll('.slot')].map(x => x.value).join('');
  if (s.lock.type === 'arrows') {
    const slots = [...document.querySelectorAll('.slot')];
    const draw = () => slots.forEach((el, i) => el.textContent = arrows[i] ? ARW[arrows[i]] : '');
    document.querySelector('.pad').addEventListener('click', e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      if (a === 'DEL') arrows.pop(); else if (arrows.length < len) arrows.push(a);
      draw();
      document.getElementById('msg').textContent = arrows.length ? 'Eingabe: ' + arrows.map(x => ARW_WORD[x]).join(', ') : '';
      document.getElementById('msg').className = 'msg';
    });
  } else {
    const ins = [...document.querySelectorAll('.slot')];
    const ok = s.lock.type === 'digits' ? /[0-9]/ : /[A-Za-zÄÖÜäöü]/;
    ins.forEach((el, i) => {
      el.addEventListener('input', () => {
        const v = [...el.value].filter(c => ok.test(c));
        el.value = v.length ? v[v.length - 1].toUpperCase() : '';
        if (el.value && ins[i + 1]) ins[i + 1].focus();
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !el.value && ins[i - 1]) { ins[i - 1].focus(); ins[i - 1].value = ''; e.preventDefault(); }
        if (e.key === 'Enter') document.getElementById('open').click();
      });
      el.addEventListener('paste', e => {
        e.preventDefault();
        const txt = (e.clipboardData.getData('text') || '').split('').filter(c => ok.test(c));
        txt.slice(0, len - i).forEach((c, k) => ins[i + k].value = c.toUpperCase());
      });
    });
  }

  // Tipp / Lösung
  const out = document.getElementById('aidsOut');
  const showAids = () => {
    out.innerHTML = (st.tips[idx] ? `<div class="aid-box"><b>Tipp</b>${esc(s.tip)}</div>` : '')
      + (st.sols[idx] ? `<div class="aid-box sol"><b>Lösung</b>${esc(s.solText)}</div>` : '');
    document.getElementById('tipBtn').disabled = !!st.tips[idx];
    document.getElementById('solBtn').disabled = !!st.sols[idx];
  };
  showAids();
  if (idx === 0) renderBonus();
  deco(idx + 1);
  const ask = (text, onYes) => {
    const m = document.getElementById('msg');
    m.className = 'msg'; m.innerHTML = `<div class="confirm" style="text-align:left">${text}<div class="row"><button type="button">Abbrechen</button><button type="button" class="yes">Ja, bitte</button></div></div>`;
    const [no, yes] = m.querySelectorAll('button'); no.onclick = () => m.innerHTML = ''; yes.onclick = () => { m.innerHTML = ''; onYes(); }; yes.focus();
  };
  document.getElementById('tipBtn').onclick = () => ask(`Ein Tipp kostet euch <b>${COST.tip} Punkte</b>.`, () => { st.tips[idx] = true; save(); showAids(); lossFx(COST.tip); });
  document.getElementById('solBtn').onclick = () => ask(`Die Lösung kostet euch <b>${COST.sol} Punkte</b>.`, () => { st.sols[idx] = true; save(); showAids(); lossFx(COST.sol); });

  // Öffnen
  const btn = document.getElementById('open'), msg = document.getElementById('msg'), lock = document.getElementById('lock');
  btn.onclick = async () => {
    const answer = read();
    if (answer.length < len) { msg.className = 'msg err'; msg.textContent = `Das Schloss braucht ${len} Zeichen.`; return; }
    btn.disabled = true; btn.textContent = 'Prüfe…'; msg.className = 'msg'; msg.textContent = '';
    const next = await decrypt(idx + 1, answer);
    if (next) {
      lock.classList.add('open'); msg.className = 'msg ok'; msg.textContent = `Klick! Stern ${WORLDS[idx]} ist zurück.`;
      const verdict = worldVerdict(idx);
      st.answers.push(answer);
      if (idx + 1 === 4) { finalData = next; st.end = Date.now(); } else stages[idx + 1] = next;
      save();
      window.scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
      await starFx(idx);
      for (const v of verdict || []) await bubbleFx(v[0], v[1]);
      idx + 1 === 4 ? renderFinal(true) : renderStage();
      return;
    }
    st.wrong++;
    const t = await trap(answer);
    if (t && t.ai) st.ai = true;
    save();
    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    msg.className = 'msg err';
    msg.textContent = t ? t.msg : 'Das Schloss bleibt zu. Prüft eure Lösung und versucht es noch einmal.';
    btn.disabled = false; btn.textContent = 'Schloss öffnen ★';
  };
}


/* ---------- Bonusfrage ---------- */
async function hashOf(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function renderBonus() {
  const box = document.getElementById('bonusBox'); if (!box) return;
  const B = DATA.bonus;
  if (st.bonus) { box.innerHTML = `<div class="extra bonus done"><b>BONUS! Bonusfrage gelöst</b><p>+${COST.bonus} Punkte für euer Heimspiel.</p></div>`; return; }
  if (st.bonusTries >= 2) { box.innerHTML = `<div class="extra bonus"><b>Bonusfrage</b><p>Zwei Versuche sind aufgebraucht. Kein Abzug, aber auch kein Bonus.</p></div>`; return; }
  box.innerHTML = `<div class="extra bonus"><b>Bonusfrage: ${esc(B.title)} · +${COST.bonus} Punkte</b>
    ${B.text.map(p => `<p>${esc(p)}</p>`).join('')}
    <div class="brow"><input id="bonusIn" class="field small" maxlength="${B.len}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Antwort Bonusfrage">
    <button type="button" class="xbtn" id="bonusGo">Prüfen</button></div>
    <span class="xnote">${2 - st.bonusTries} Versuch${2 - st.bonusTries === 1 ? '' : 'e'} übrig. Falsche Antworten kosten nichts. Achtung: Die Bonusfrage gibt es nur auf dieser Seite.</span></div>`;
  const go = async () => {
    const v = document.getElementById('bonusIn').value;
    if (norm(v).length !== B.len) return;
    const okB = await hashOf(v) === B.hash; if (okB) st.bonus = true; else st.bonusTries++;
    save(); renderBonus(); if (okB) bonusFx(COST.bonus);
  };
  document.getElementById('bonusGo').onclick = go;
  document.getElementById('bonusIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}
