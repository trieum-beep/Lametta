<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation Lametta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #E9DFCB;
  --bg2: #DDD0B6;
  --ink: #16233F;
  --ink-soft: #4A5570;
  --paper: #FBF6EA;
  --paper-ink: #1B2A47;
  --paper-line: #E3D6BD;
  --lamp: #A87A12;
  --lamp-glow: rgba(168,122,18,.18);
  --brass: #B8893A;
  --brass-hi: #E4C27A;
  --signal: #C03A30;
  --ok: #2E8B57;
  --uv: #7A5CFF;
  --uv-bg: #1C1245;
  --uv-ink: #D9CCFF;
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A2E; --bg2: #16243F; --ink: #EDE6D6; --ink-soft: #9AA6C0;
    --paper: #F4EBD9; --paper-ink: #1B2A47; --paper-line: #E0D2B6;
    --lamp: #F2C14E; --lamp-glow: rgba(242,193,78,.22);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A2E; --bg2: #16243F; --ink: #EDE6D6; --ink-soft: #9AA6C0;
  --paper: #F4EBD9; --paper-ink: #1B2A47; --paper-line: #E0D2B6;
  --lamp: #F2C14E; --lamp-glow: rgba(242,193,78,.22);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, var(--lamp-glow), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }

/* Kopf */
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.stamp { width: 52px; height: 52px; flex: none; transform: rotate(-10deg); }
.stamp circle, .stamp path, .stamp ellipse { stroke: var(--lamp); }
.stamp text { fill: var(--lamp); }
.head-txt { flex: 1; min-width: 0; }
.head-txt h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
.head-txt .team { font-size: 13px; color: var(--ink-soft); }
.team .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2F6FD6; margin-right: 6px; vertical-align: 1px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: var(--lamp); }

.progress { display: flex; gap: 8px; margin: 0 0 16px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--bg2); position: relative; overflow: hidden; }
.progress span.done { background: var(--lamp); }
.progress span.now { background: linear-gradient(90deg, var(--lamp) 0 35%, var(--bg2) 35%); }

/* Karte mit Rückseite */
.card-wrap { perspective: 1400px; }
.card { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
.card.flipped { transform: rotateY(180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; }
.front {
  background: var(--paper); color: var(--paper-ink);
  padding: 26px 24px 22px;
  box-shadow: 0 1px 0 var(--paper-line), 0 18px 40px -22px rgba(0,0,0,.55);
  border-top: 3px solid #2F6FD6;
}
.front h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 0 0 14px; }
.front p { font-family: var(--serif); font-size: 18px; line-height: 1.75; margin: 0 0 14px; }
.front p:last-of-type { margin-bottom: 0; }
.back {
  position: absolute; inset: 0; transform: rotateY(180deg);
  background: var(--uv-bg); color: var(--uv-ink);
  display: grid; place-items: center; text-align: center; padding: 28px;
  background-image: radial-gradient(60% 50% at 50% 50%, rgba(122,92,255,.35), transparent 70%);
}
.back p { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.4; margin: 0;
  text-shadow: 0 0 12px rgba(160,130,255,.9), 0 0 28px rgba(122,92,255,.7); }
.back small { display: block; margin-top: 14px; font-family: var(--sans); font-size: 12px; color: #9D8CE0; font-style: normal; text-shadow: none; }
.sr-trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.uv-btn {
  margin: 14px 0 0; width: 100%; padding: 13px 16px; border-radius: 6px;
  border: 1.5px dashed var(--uv); background: transparent; color: var(--ink);
  font: 600 15px var(--sans); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.uv-btn:active, .uv-btn.on { background: var(--uv); color: #fff; border-style: solid; }

/* Schloss */
.lock { margin-top: 28px; text-align: center; }
.shackle { width: 120px; height: 70px; display: block; margin: 0 auto -6px; overflow: visible; }
.shackle path { fill: none; stroke: var(--brass); stroke-width: 12; stroke-linecap: round; transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 96px 70px; }
.lock.open .shackle path { transform: translateY(-14px) rotate(28deg); }
.body {
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, #8A6424);
  border-radius: 14px; padding: 18px 14px 16px; position: relative;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2), 0 18px 34px -18px rgba(0,0,0,.6);
}
.lock-label { font-size: 13px; font-weight: 600; color: #3A2A0E; margin-bottom: 12px; }
.tumblers { display: flex; justify-content: center; gap: 8px; }
.tumbler { display: flex; flex-direction: column; align-items: center; width: 52px; }
.tumbler button {
  width: 100%; height: 34px; border: 0; background: rgba(58,42,14,.18); color: #3A2A0E;
  font-size: 16px; cursor: pointer; border-radius: 6px;
}
.tumbler button:active { background: rgba(58,42,14,.35); }
.tumbler .val {
  width: 100%; height: 58px; margin: 5px 0; display: grid; place-items: center;
  background: linear-gradient(180deg, #2A2116, #0E0B07 50%, #2A2116);
  color: #F5E7C4; font: 600 28px var(--serif); border-radius: 6px; outline: none;
  box-shadow: inset 0 3px 6px rgba(0,0,0,.6);
}
.tumbler .val:focus-visible { box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px #fff, 0 0 0 5px #2F6FD6; }
.lock.shake .body { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.open-btn {
  margin-top: 16px; width: 100%; padding: 15px; border: 0; border-radius: 8px;
  background: var(--ink); color: var(--bg); font: 700 16px var(--sans); cursor: pointer;
}
.open-btn[disabled] { opacity: .6; cursor: progress; }
.msg { min-height: 48px; margin-top: 12px; font-size: 15px; text-align: center; color: var(--ink-soft); }
.msg.err { color: var(--signal); }
.msg.ok { color: var(--ok); font-weight: 600; }
:focus-visible { outline: 3px solid #2F6FD6; outline-offset: 2px; }

/* Login */
.field { width: 100%; padding: 15px 14px; font: 600 20px var(--sans); letter-spacing: .08em; text-transform: uppercase;
  border: 1.5px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--paper-ink); margin-top: 6px; }

/* Finale */
.final { text-align: center; padding-top: 10px; }
.q { font-family: var(--serif); font-size: 160px; line-height: 1; color: var(--lamp);
  text-shadow: 0 0 40px var(--lamp-glow), 0 0 80px var(--lamp-glow); margin: 10px 0 18px; }
.play { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--lamp); color: #16233F; text-decoration: none; }
.play svg { width: 30px; height: 30px; margin-left: 5px; }
.play.off { opacity: .35; pointer-events: none; }
.stats { margin: 30px 0 0; text-align: left; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 18px 20px; }
.stats h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.stats p { margin: 0 0 12px; font-size: 14px; color: #5A6278; }
.stats dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: 15px; }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.stats .flag { color: var(--signal); }

footer { margin-top: 34px; font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer button { background: none; border: 0; color: var(--ink-soft); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .card, .shackle path { transition: none; }
  .lock.shake .body { animation: none; }
}

/* Hilfe-Leiste */
body { padding-bottom: 96px; }
.helpbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 18px calc(10px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--bg2); z-index: 10; }
.helpbar button { display: block; width: 100%; max-width: 520px; margin: 0 auto; padding: 13px; border-radius: 8px;
  border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 15px var(--sans); cursor: pointer; }
dialog { border: 0; padding: 0; width: min(520px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0;
  border-radius: 14px 14px 0 0; background: var(--paper); color: var(--paper-ink); }
dialog::backdrop { background: rgba(8,12,24,.55); }
.sheet { padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-family: var(--serif); font-weight: 600; font-size: 24px; margin: 0 0 4px; }
.sheet .sub { font-size: 14px; color: #5A6278; margin: 0 0 16px; }
.act { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; margin-bottom: 10px;
  border-radius: 10px; border: 1px solid var(--paper-line); background: #fff; color: var(--paper-ink); text-decoration: none; font: inherit; cursor: pointer; }
.act .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 18px; color: #fff; }
.act b { display: block; font-size: 16px; }
.act span { font-size: 13px; color: #5A6278; }
.act .cost { margin-left: auto; font-weight: 700; font-size: 13px; color: var(--signal); white-space: nowrap; }
.act.off { opacity: .45; pointer-events: none; }
.close { width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 8px; background: var(--paper-ink); color: var(--paper); font: 700 15px var(--sans); cursor: pointer; }
.confirm { background: #FFF3E6; border: 1px solid #F0CFA8; border-radius: 10px; padding: 14px; margin-bottom: 12px; font-size: 15px; }
.confirm .row { display: flex; gap: 10px; margin-top: 12px; }
.confirm .row button { flex: 1; padding: 12px; border-radius: 8px; font: 700 14px var(--sans); cursor: pointer; border: 1px solid var(--paper-ink); background: #fff; color: var(--paper-ink); }
.confirm .row button.yes { background: var(--signal); border-color: var(--signal); color: #fff; }
.map-box { background: #F6EEDC; border-radius: 10px; padding: 8px; }
.map-box svg { width: 100%; height: auto; display: block; }
.map-note { font-family: var(--serif); font-style: italic; font-size: 14px; color: #6B5A3A; text-align: center; margin: 10px 0 12px; }
.emerg { background: #fff; border: 2px solid var(--signal); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.emerg h3 { font-family: var(--serif); margin: 0 0 6px; font-size: 22px; }
.emerg ul { margin: 10px 0 0; padding-left: 18px; font-size: 15px; }

.score { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-align: right; }
.score b { display: block; font-size: 15px; color: var(--lamp); }
.front .kind { font-size: 13px; font-weight: 600; color: #5A6278; margin: -6px 0 14px; }
.photos { list-style: none; padding: 0; margin: 4px 0 0; counter-reset: ph; }
.photos li { font-family: var(--serif); font-size: 17px; line-height: 1.55; padding: 8px 0 8px 40px; position: relative; border-top: 1px solid var(--paper-line); }
.photos li::before { counter-increment: ph; content: counter(ph); position: absolute; left: 0; top: 8px; width: 26px; height: 26px; border-radius: 50%;
  background: #1B2A47; color: #fff; font: 700 13px var(--sans); display: grid; place-items: center; }
.found { display: flex; gap: 8px; margin: 6px 0 2px; }
.found span { width: 44px; height: 52px; border-radius: 6px; display: grid; place-items: center; font: 600 26px var(--serif);
  background: linear-gradient(180deg, #F6DC8C, #D4A93F); color: #3A2A0E; box-shadow: 0 6px 14px -8px rgba(0,0,0,.5); }
.found span.empty { background: transparent; border: 2px dashed #CBB88F; color: #CBB88F; }

.slots { display: flex; justify-content: center; gap: 8px; }
.slot { width: 50px; height: 60px; border: 0; border-radius: 6px; text-align: center; text-transform: uppercase;
  background: linear-gradient(180deg, #2A2116, #0E0B07 50%, #2A2116); color: #F5E7C4; font: 600 28px var(--serif);
  box-shadow: inset 0 3px 6px rgba(0,0,0,.6); caret-color: #F2C14E; padding: 0; }
.slot:focus { outline: none; box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px #fff, 0 0 0 5px #2F6FD6; }
.slot.arrow { display: grid; place-items: center; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 52px); gap: 8px; justify-content: center; margin-top: 14px; }
.pad button { border: 0; border-radius: 8px; background: rgba(58,42,14,.2); color: #3A2A0E; font: 600 24px var(--sans); cursor: pointer; }
.pad button:active { background: rgba(58,42,14,.4); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .del { grid-column: 3; grid-row: 1; font-size: 14px; }

.aids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.aids button { padding: 12px 10px; border-radius: 8px; border: 1.5px solid var(--ink-soft); background: transparent; color: var(--ink); font: 600 14px var(--sans); cursor: pointer; }
.aids button small { display: block; font-weight: 700; color: var(--signal); font-size: 12px; }
.aid-box { margin-top: 14px; padding: 14px 16px; border-radius: 6px; background: var(--paper); color: var(--paper-ink); border-left: 4px solid var(--lamp); font-size: 15px; }
.aid-box b { display: block; font-size: 12px; color: #5A6278; margin-bottom: 2px; }
.aid-box.sol { border-left-color: var(--signal); }
.aids button[disabled] { opacity: .4; cursor: default; }
.found-lbl { font: 600 12px var(--sans); color: #5A6278; margin-top: 16px; }
.extra { margin-top: 14px; padding: 14px 16px; border-radius: 6px; background: var(--paper); color: var(--paper-ink); font-size: 15px; }
.extra b { display: block; font-size: 13px; margin-bottom: 4px; }
.extra p { margin: 0 0 8px; }
.extra.photo { border-left: 4px solid #2F6FD6; }
.extra.bonus { border-left: 4px solid #0B3D91; }
.extra.bonus.done { border-left-color: var(--ok); }
.xbtn { display: inline-block; padding: 10px 14px; border-radius: 8px; border: 0; background: #1B2A47; color: #fff; font: 700 14px var(--sans); text-decoration: none; cursor: pointer; }
.xnote { display: block; font-size: 12.5px; color: #5A6278; margin-top: 6px; }
.brow { display: flex; gap: 8px; align-items: center; }
.field.small { font-size: 18px; padding: 10px 12px; margin: 0; flex: 1; }
.slots .slot { flex: 1 1 0; min-width: 0; max-width: 50px; }
.found span { width: auto; flex: 1 1 0; max-width: 44px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="stamp" viewBox="-60 -60 120 120" aria-hidden="true">
      <circle r="55" fill="none" stroke-width="4"/>
      <circle r="38" fill="none" stroke-width="1.5"/>
      <g fill="none" stroke-width="4.5" stroke-linecap="round">
        <ellipse cx="-20" cy="0" rx="7" ry="11"/>
        <path d="M 5,-10.5 Q -2,-12 -5,-4 Q -7,3 -5,6"/><ellipse cx="0" cy="4" rx="6.2" ry="6.8"/>
        <ellipse cx="20" cy="0" rx="7" ry="11"/><path d="M 27,4 L 27.4,8"/>
      </g>
    </svg>
    <div class="head-txt">
      <h1>Operation Lametta</h1>
      <div class="team"><span class="dot" id="teamDot"></span><span id="teamName">Noch kein Team</span> · <span class="clock" id="clock">00:00</span></div>
    </div>
    <div class="score" aria-live="polite"><b id="points">100</b>Punkte</div>
  </header>
  <div class="progress" id="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <main id="app" aria-live="polite"></main>
  <footer>
    <span>Ausgabe Nr. 485</span>
    <button type="button" id="reset">Spiel zurücksetzen</button>
  </footer>
</div>
<div class="helpbar"><button type="button" id="helpOpen">Hilfe &amp; Spickzettel</button></div>

const STORE = 'lametta-v1';
const COST = { tip: 10, sol: 25, map: 30, bonus: 10 };
const te = new TextEncoder(), td = new TextDecoder();
const $app = document.getElementById('app');
const norm = s => s.toUpperCase().replace(/Ä/g, 'AE').replace(/Ö/g, 'OE').replace(/Ü/g, 'UE').replace(/[^A-Z0-9]/g, '');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const SALT = b64(DATA.salt);
const ARW = { U: '↑', R: '→', D: '↓', L: '←' };
const ARW_WORD = { U: 'oben', R: 'rechts', D: 'unten', L: 'links' };

let st = load(), stages = [], finalData = null;
function fresh() { return { team: null, answers: [], start: null, end: null, wrong: 0, ai: false, map: false, tips: [], sols: [], bonus: false, bonusTries: 0 }; }
const teamOf = () => DATA.teams.find(t => t.id === st.team);
function renderTeam() { const t = teamOf(); document.getElementById('teamName').textContent = t ? 'Team ' + t.name : 'Noch kein Team'; document.getElementById('teamDot').style.background = t ? t.color : 'var(--ink-soft)'; }
function load() { try { return Object.assign(fresh(), JSON.parse(localStorage.getItem(STORE)) || {}); } catch (e) { return fresh(); } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch (e) {} renderPoints(); }
function points() {
  const p = 100 + (st.bonus ? COST.bonus : 0) - st.tips.filter(Boolean).length * COST.tip - st.sols.filter(Boolean).length * COST.sol - (st.map ? COST.map : 0);
  return Math.max(0, p);
}
function renderPoints() { document.getElementById('points').textContent = points(); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function decryptBlob(blob, answer, idx) {
  try {
    const base = await crypto.subtle.importKey('raw', te.encode(norm(answer) + '|' + idx), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: DATA.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const raw = b64(blob);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, key, raw.slice(12));
    return JSON.parse(td.decode(pt));
  } catch (e) { return null; }
}
const decrypt = (idx, answer, team) => decryptBlob(DATA.blobs[team || st.team][idx], answer, idx);
async function trap(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
  return (DATA.traps[st.team] || {})[hash] || null;
}

function renderProgress() {
  const solved = Math.max(0, st.answers.length - 1);
  [...document.querySelectorAll('#progress span')].forEach((el, i) => {
    el.className = finalData || i < solved ? 'done' : (i === solved && st.answers.length ? 'now' : '');
  });
}
function tick() {
  const el = document.getElementById('clock');
  if (!st.start) { el.textContent = '00:00'; return; }
  const ms = (st.end || Date.now()) - st.start;
  el.textContent = String(Math.floor(ms / 60000)).padStart(2, '0') + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0');
}
setInterval(tick, 1000);

/* ---------- Login ---------- */
function renderLogin(err) {
  renderProgress();
  $app.innerHTML = `
    <div class="face front">
      <h2>Willkommen, Team.</h2>
      <p>Gebt euren Teamcode ein. Er steht auf eurer Teamkarte. Ab dann läuft die Uhr, und ihr startet mit 100 Punkten.</p>
      <label for="code" style="font:600 14px var(--sans)">Teamcode</label>
      <input id="code" class="field" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <button class="open-btn" id="go" type="button">Spiel starten</button>
    <div class="msg ${err ? 'err' : ''}" id="msg">${err || ''}</div>`;
  const input = document.getElementById('code'), go = document.getElementById('go');
  const submit = async () => {
    if (!input.value.trim()) { renderLogin('Bitte gebt zuerst euren Teamcode ein.'); return; }
    go.disabled = true; go.textContent = 'Prüfe Code…';
    const code = norm(input.value);
    const team = DATA.teams.find(t => code.startsWith(t.prefix));
    const s = team ? await decrypt(0, input.value, team.id) : null;
    if (!s) { renderLogin('Dieser Teamcode passt nicht. Prüft die Schreibweise auf eurer Teamkarte.'); return; }
    st.team = team.id; stages[0] = s; st.answers = [input.value]; renderTeam(); st.start = st.start || Date.now(); save(); renderStage();
  };
  go.onclick = submit; input.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

const LOCKNAME = { letters: 'Nur Buchstaben', digits: 'Nur Zahlen', arrows: 'Nur Pfeile' };

function renderStage() {
  const idx = st.answers.length - 1, s = stages[idx];

  const body = s.text.map((t, i) => `<p>${esc(t)}${i === s.text.length - 1 && !s.list ? trapSpan : ''}</p>`).join('')

    + (s.found ? `<div class="found-lbl">${esc(s.foundLabel || 'Fundstück')}</div><div class="found">${s.found.map(f => f && f !== '?' ? `<span>${esc(f)}</span>` : '<span class="empty">?</span>').join('')}</div>` : '');
  const len = s.lock.len;
  let inputHtml;
  if (s.lock.type === 'arrows') {
    inputHtml = `<div class="slots" id="slots">${Array(len).fill('<div class="slot arrow" aria-hidden="true"></div>').join('')}</div>
      <div class="pad" role="group" aria-label="Pfeile eingeben">

        <button type="button" class="del" data-a="DEL" aria-label="Letzten Pfeil löschen">Löschen</button>
        <button type="button" class="left" data-a="L" aria-label="Pfeil nach links">←</button>
        <button type="button" class="down" data-a="D" aria-label="Pfeil nach unten">↓</button>
        <button type="button" class="right" data-a="R" aria-label="Pfeil nach rechts">→</button>
      </div>`;
  } else {

    inputHtml = `<div class="slots" id="slots">${Array(len).fill(0).map((_, i) =>
      `<input class="slot" maxlength="1" ${num ? 'inputmode="numeric" pattern="[0-9]*"' : 'inputmode="text" autocapitalize="characters"'} autocomplete="off" spellcheck="false" aria-label="Zeichen ${i + 1} von ${len}">`).join('')}</div>`;
  }
  $app.innerHTML = `
    <div class="face front"><h2>${esc(s.title)}</h2><div class="kind">${LOCKNAME[s.lock.type]} · ${len} Zeichen</div>${body}</div>
    <div id="aidsOut"></div>
    <div class="lock" id="lock">
      <svg class="shackle" viewBox="0 0 120 70" aria-hidden="true"><path d="M24,70 V42 A36,36 0 0 1 96,42 V70"/></svg>
      <div class="body">
        <div class="lock-label">${s.n <= 3 ? 'Schloss ' + s.n : 'Letztes Schloss'} · ${LOCKNAME[s.lock.type]}</div>
        ${inputHtml}
      </div>
      <button class="open-btn" id="open" type="button">Schloss öffnen</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="aids">
      <button type="button" id="tipBtn">Tipp holen<small>−${COST.tip} Punkte</small></button>
      <button type="button" id="solBtn">Lösung zeigen<small>−${COST.sol} Punkte</small></button>
    </div>
    ${s.photo ? `<div class="extra photo"><b>Foto-Aufgabe</b><p>${esc(s.photo)}</p>${DATA.album
      ? `<a class="xbtn" href="${esc(DATA.album)}" target="_blank" rel="noopener">Foto ins Team-Album</a>`
      : '<span class="xnote">Der Album-Link wird noch eingetragen.</span>'}</div>` : ''}
    <div id="bonusBox"></div>`;

  // Eingabe
  let arrows = [];
  const read = () => s.lock.type === 'arrows' ? arrows.join('') : [...document.querySelectorAll('.slot')].map(x => x.value).join('');
  if (s.lock.type === 'arrows') {
    const slots = [...document.querySelectorAll('.slot')];
    const draw = () => slots.forEach((el, i) => el.textContent = arrows[i] ? ARW[arrows[i]] : '');
    document.querySelector('.pad').addEventListener('click', e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      if (a === 'DEL') arrows.pop(); else if (arrows.length < len) arrows.push(a);
      draw();
      document.getElementById('msg').textContent = arrows.length ? 'Eingabe: ' + arrows.map(x => ARW_WORD[x]).join(', ') : '';
      document.getElementById('msg').className = 'msg';
    });
  } else {
    const ins = [...document.querySelectorAll('.slot')];
    const ok = s.lock.type === 'digits' ? /[0-9]/ : /[A-Za-zÄÖÜäöü]/;
    ins.forEach((el, i) => {
      el.addEventListener('input', () => {
        const v = [...el.value].filter(c => ok.test(c));
        el.value = v.length ? v[v.length - 1].toUpperCase() : '';
        if (el.value && ins[i + 1]) ins[i + 1].focus();
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !el.value && ins[i - 1]) { ins[i - 1].focus(); ins[i - 1].value = ''; e.preventDefault(); }
        if (e.key === 'Enter') document.getElementById('open').click();
      });
      el.addEventListener('paste', e => {
        e.preventDefault();
        const txt = (e.clipboardData.getData('text') || '').split('').filter(c => ok.test(c));
        txt.slice(0, len - i).forEach((c, k) => ins[i + k].value = c.toUpperCase());
      });
    });
  }

  // Tipp / Lösung
  const out = document.getElementById('aidsOut');
  const showAids = () => {
    out.innerHTML = (st.tips[idx] ? `<div class="aid-box"><b>Tipp</b>${esc(s.tip)}</div>` : '')
      + (st.sols[idx] ? `<div class="aid-box sol"><b>Lösung</b>${esc(s.solText)}</div>` : '');
    document.getElementById('tipBtn').disabled = !!st.tips[idx];
    document.getElementById('solBtn').disabled = !!st.sols[idx];
  };
  showAids();
  renderBonus();
  const ask = (text, onYes) => {
    const m = document.getElementById('msg');
    m.className = 'msg'; m.innerHTML = `<div class="confirm" style="text-align:left">${text}<div class="row"><button type="button">Abbrechen</button><button type="button" class="yes">Ja, bitte</button></div></div>`;
    const [no, yes] = m.querySelectorAll('button'); no.onclick = () => m.innerHTML = ''; yes.onclick = () => { m.innerHTML = ''; onYes(); }; yes.focus();
  };
  document.getElementById('tipBtn').onclick = () => ask(`Ein Tipp kostet euch <b>${COST.tip} Punkte</b>.`, () => { st.tips[idx] = true; save(); showAids(); });
  document.getElementById('solBtn').onclick = () => ask(`Die Lösung kostet euch <b>${COST.sol} Punkte</b>.`, () => { st.sols[idx] = true; save(); showAids(); });

  // Öffnen
  const btn = document.getElementById('open'), msg = document.getElementById('msg'), lock = document.getElementById('lock');
  btn.onclick = async () => {
    const answer = read();
    if (answer.length < len) { msg.className = 'msg err'; msg.textContent = `Das Schloss braucht ${len} Zeichen.`; return; }
    btn.disabled = true; btn.textContent = 'Prüfe…'; msg.className = 'msg'; msg.textContent = '';
    const next = await decrypt(idx + 1, answer);
    if (next) {
      lock.classList.add('open'); msg.className = 'msg ok'; msg.textContent = 'Klick. Das Schloss ist offen.';
      st.answers.push(answer);
      if (idx + 1 === 4) { finalData = next; st.end = Date.now(); } else stages[idx + 1] = next;
      save();
      setTimeout(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); idx + 1 === 4 ? renderFinal() : renderStage(); }, 1100);
      return;
    }
    st.wrong++;
    const t = await trap(answer);
    if (t && t.ai) st.ai = true;
    save();
    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    msg.className = 'msg err';
    msg.textContent = t ? t.msg : 'Das Schloss bleibt zu. Prüft eure Lösung und versucht es noch einmal.';
    btn.disabled = false; btn.textContent = 'Schloss öffnen';
  };
}


/* ---------- Bonusfrage ---------- */
async function hashOf(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function renderBonus() {
  const box = document.getElementById('bonusBox'); if (!box) return;
  const B = DATA.bonus;
  if (st.bonus) { box.innerHTML = `<div class="extra bonus done"><b>Bonusfrage gelöst</b><p>+${COST.bonus} Punkte für euer Heimspiel.</p></div>`; return; }
  if (st.bonusTries >= 2) { box.innerHTML = `<div class="extra bonus"><b>Bonusfrage</b><p>Zwei Versuche sind aufgebraucht. Kein Abzug, aber auch kein Bonus.</p></div>`; return; }
  box.innerHTML = `<div class="extra bonus"><b>Bonusfrage: ${esc(B.title)} · +${COST.bonus} Punkte</b>
    ${B.text.map(p => `<p>${esc(p)}</p>`).join('')}
    <div class="brow"><input id="bonusIn" class="field small" maxlength="${B.len}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Antwort Bonusfrage">
    <button type="button" class="xbtn" id="bonusGo">Prüfen</button></div>
    <span class="xnote">${2 - st.bonusTries} Versuch${2 - st.bonusTries === 1 ? '' : 'e'} übrig. Falsche Antworten kosten nichts.</span></div>`;
  const go = async () => {
    const v = document.getElementById('bonusIn').value;
    if (norm(v).length !== B.len) return;
    if (await hashOf(v) === B.hash) st.bonus = true; else st.bonusTries++;
    save(); renderBonus();
  };
  document.getElementById('bonusGo').onclick = go;
  document.getElementById('bonusIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- Finale ---------- */
function renderFinal() {
  renderProgress();
  const ms = (st.end || Date.now()) - st.start;
  const url = finalData && finalData.video;
  const nTips = st.tips.filter(Boolean).length, nSols = st.sols.filter(Boolean).length;
  $app.innerHTML = `
    <div class="final">
      <div class="q" aria-hidden="true">?</div>
      <a class="play ${url ? '' : 'off'}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener"` : ''} aria-label="Abspielen">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
      </a>
      ${url ? '' : '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px">Video-Link fehlt noch. Bitte in der Orga-Version eintragen.</p>'}
      <div class="stats">
        <h3>Eure Akte</h3>
        <p>Zeigt diesen Bildschirm bei eurer Ankunft.</p>
        <dl>
          <dt>Punkte</dt><dd>${points()} von 110</dd>
          <dt>Bonusfrage</dt><dd>${st.bonus ? 'richtig (+' + COST.bonus + ')' : 'nicht gelöst'}</dd>
          <dt>Spielzeit</dt><dd>${Math.floor(ms / 60000)} Min. ${String(Math.floor(ms / 1000) % 60).padStart(2, '0')} Sek.</dd>
          <dt>Fehlversuche</dt><dd>${st.wrong}</dd>
          <dt>Tipps genutzt</dt><dd>${nTips} (−${nTips * COST.tip})</dd>
          <dt>Lösungen genutzt</dt><dd>${nSols} (−${nSols * COST.sol})</dd>
          <dt>Spickzettel</dt><dd class="${st.map ? 'flag' : ''}">${st.map ? 'ja (−' + COST.map + ')' : 'nein'}</dd>
          <dt>KI-Verdacht</dt><dd class="${st.ai ? 'flag' : ''}">${st.ai ? 'ja' : 'nein'}</dd>
        </dl>
      </div>
    </div>`;
  tick();
}

/* ---------- Hilfe & Spickzettel ---------- */
const dlg = document.getElementById('help'), sheet = document.getElementById('sheet');
const tel = DATA.hotline ? DATA.hotline.replace(/[^+0-9]/g, '') : '';
function helpMenu() {
  sheet.innerHTML = `
    <h2 id="helpTitle">Hilfe &amp; Spickzettel</h2>
    <p class="sub">Tipps und Lösungen gibt es direkt unter jedem Auftrag.</p>
    <a class="act ${tel ? '' : 'off'}" ${tel ? `href="tel:${tel}"` : ''}>
      <div class="ic" style="background:#2E8B57">✆</div><div><b>Orga-Hotline anrufen</b><span>${tel ? esc(DATA.hotline) : 'Nummer wird noch eingetragen'}</span></div></a>
    <a class="act ${tel ? '' : 'off'}" ${tel ? `href="https://wa.me/${tel.replace('+', '')}" target="_blank" rel="noopener"` : ''}>
      <div class="ic" style="background:#25A162">✉</div><div><b>WhatsApp an die Orga</b><span>Für Fragen und Notfälle</span></div></a>
    <button class="act" type="button" id="mapBtn">
      <div class="ic" style="background:#8A6424">✦</div><div><b>Spickzettel-Karte</b><span>Euer Start und eure Stationen</span></div>
      <div class="cost">${st.map ? 'geöffnet' : '−' + COST.map + ' Punkte'}</div></button>
    <button class="close" type="button" id="closeHelp">Schließen</button>`;
  document.getElementById('closeHelp').onclick = () => dlg.close();
  document.getElementById('mapBtn').onclick = () => {
    if (!stages[0]) { dlg.close(); return; }
    if (st.map) return showMap();
    const box = document.createElement('div'); box.className = 'confirm';
    box.innerHTML = `Die Karte kostet euch <b>${COST.map} Punkte</b>. Das lässt sich nicht rückgängig machen.<div class="row"><button type="button">Abbrechen</button><button type="button" class="yes">Karte öffnen</button></div>`;
    sheet.insertBefore(box, sheet.children[2]);
    const [no, ok] = box.querySelectorAll('button');
    no.onclick = () => box.remove(); ok.onclick = () => { st.map = true; save(); showMap(); }; ok.focus();
  };
}
function showMap() {
  sheet.innerHTML = `<h2 id="helpTitle">Spickzettel</h2><p class="sub">Das Logo ist euer Start. 1 bis 3 sind eure Stationen${stages[0].hasEnd ? ', E ist euer Endpunkt' : ''}. Namen gibt es keine.</p>
    <div class="map-box">${stages[0].map}</div>
    <p class="map-note">Das Blaue fließt, das Grüne umarmt. Die Karte steht kopf, der Pfeil nicht.</p>
    <button class="close" type="button" id="back">Zurück</button>`;
  document.getElementById('back').onclick = helpMenu;
}
document.getElementById('helpOpen').onclick = () => { helpMenu(); dlg.showModal(); };
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- Start ---------- */
async function boot() {
  renderPoints(); renderTeam();
  if (!st.answers.length) { renderLogin(); tick(); return; }
  $app.innerHTML = '<p class="msg">Lade euren Spielstand…</p>';
  for (let i = 0; i < st.answers.length; i++) {
    const d = await decrypt(i, st.answers[i]);
    if (!d) { st = fresh(); save(); renderLogin(); return; }
    if (i === 4) finalData = d; else stages[i] = d;
  }
  tick();
  finalData ? renderFinal() : renderStage();
}
document.getElementById('reset').onclick = () => {
  if (confirm('Spielstand wirklich löschen? Uhr und Punkte starten dann neu.')) {
    try { localStorage.removeItem(STORE); } catch (e) {}
    st = fresh(); stages = []; finalData = null; renderPoints(); renderTeam(); tick(); renderLogin();
  }
};
boot();
</script>
