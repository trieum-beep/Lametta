:root {
  --bg: #E9DFCB;
  --bg2: #DDD0B6;
  --ink: #16233F;
  --ink-soft: #4A5570;
  --paper: #FBF6EA;
  --paper-ink: #1B2A47;
  --paper-line: #E3D6BD;
  --lamp: #A87A12;
  --lamp-glow: rgba(168,122,18,.18);
  --brass: #B8893A;
  --brass-hi: #E4C27A;
  --signal: #C03A30;
  --ok: #2E8B57;
  --uv: #7A5CFF;
  --uv-bg: #1C1245;
  --uv-ink: #D9CCFF;
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A2E; --bg2: #16243F; --ink: #EDE6D6; --ink-soft: #9AA6C0;
    --paper: #F4EBD9; --paper-ink: #1B2A47; --paper-line: #E0D2B6;
    --lamp: #F2C14E; --lamp-glow: rgba(242,193,78,.22);
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A2E; --bg2: #16243F; --ink: #EDE6D6; --ink-soft: #9AA6C0;
  --paper: #F4EBD9; --paper-ink: #1B2A47; --paper-line: #E0D2B6;
  --lamp: #F2C14E; --lamp-glow: rgba(242,193,78,.22);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(120% 60% at 50% -10%, var(--lamp-glow), transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; margin: 0 auto; padding: 20px 18px 40px; }

/* Kopf */
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.stamp { width: 52px; height: 52px; flex: none; transform: rotate(-10deg); }
.stamp circle, .stamp path, .stamp ellipse { stroke: var(--lamp); }
.stamp text { fill: var(--lamp); }
.head-txt { flex: 1; min-width: 0; }
.head-txt h1 { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
.head-txt .team { font-size: 13px; color: var(--ink-soft); }
.team .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2F6FD6; margin-right: 6px; vertical-align: 1px; }
.clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: var(--lamp); }

.progress { display: flex; gap: 8px; margin: 0 0 16px; }
.progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--bg2); position: relative; overflow: hidden; }
.progress span.done { background: var(--lamp); }
.progress span.now { background: linear-gradient(90deg, var(--lamp) 0 35%, var(--bg2) 35%); }

/* Karte mit Rückseite */
.card-wrap { perspective: 1400px; }
.card { position: relative; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.3,1); }
.card.flipped { transform: rotateY(180deg); }
.face { backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 6px; }
.front {
  background: var(--paper); color: var(--paper-ink);
  padding: 26px 24px 22px;
  box-shadow: 0 1px 0 var(--paper-line), 0 18px 40px -22px rgba(0,0,0,.55);
  border-top: 3px solid #2F6FD6;
}
.front h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; line-height: 1.1; margin: 0 0 14px; }
.front p { font-family: var(--serif); font-size: 18px; line-height: 1.75; margin: 0 0 14px; }
.front p:last-of-type { margin-bottom: 0; }
.back {
  position: absolute; inset: 0; transform: rotateY(180deg);
  background: var(--uv-bg); color: var(--uv-ink);
  display: grid; place-items: center; text-align: center; padding: 28px;
  background-image: radial-gradient(60% 50% at 50% 50%, rgba(122,92,255,.35), transparent 70%);
}
.back p { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.4; margin: 0;
  text-shadow: 0 0 12px rgba(160,130,255,.9), 0 0 28px rgba(122,92,255,.7); }
.back small { display: block; margin-top: 14px; font-family: var(--sans); font-size: 12px; color: #9D8CE0; font-style: normal; text-shadow: none; }
.sr-trap { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.uv-btn {
  margin: 14px 0 0; width: 100%; padding: 13px 16px; border-radius: 6px;
  border: 1.5px dashed var(--uv); background: transparent; color: var(--ink);
  font: 600 15px var(--sans); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none;
}
.uv-btn:active, .uv-btn.on { background: var(--uv); color: #fff; border-style: solid; }

/* Schloss */
.lock { margin-top: 28px; text-align: center; }
.shackle { width: 120px; height: 70px; display: block; margin: 0 auto -6px; overflow: visible; }
.shackle path { fill: none; stroke: var(--brass); stroke-width: 12; stroke-linecap: round; transition: transform .5s cubic-bezier(.3,1.6,.5,1); transform-origin: 96px 70px; }
.lock.open .shackle path { transform: translateY(-14px) rotate(28deg); }
.body {
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, #8A6424);
  border-radius: 14px; padding: 18px 14px 16px; position: relative;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.2), 0 18px 34px -18px rgba(0,0,0,.6);
}
.lock-label { font-size: 13px; font-weight: 600; color: #3A2A0E; margin-bottom: 12px; }
.tumblers { display: flex; justify-content: center; gap: 8px; }
.tumbler { display: flex; flex-direction: column; align-items: center; width: 52px; }
.tumbler button {
  width: 100%; height: 34px; border: 0; background: rgba(58,42,14,.18); color: #3A2A0E;
  font-size: 16px; cursor: pointer; border-radius: 6px;
}
.tumbler button:active { background: rgba(58,42,14,.35); }
.tumbler .val {
  width: 100%; height: 58px; margin: 5px 0; display: grid; place-items: center;
  background: linear-gradient(180deg, #2A2116, #0E0B07 50%, #2A2116);
  color: #F5E7C4; font: 600 28px var(--serif); border-radius: 6px; outline: none;
  box-shadow: inset 0 3px 6px rgba(0,0,0,.6);
}
.tumbler .val:focus-visible { box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 3px #fff, 0 0 0 5px #2F6FD6; }
.lock.shake .body { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
.open-btn {
  margin-top: 16px; width: 100%; padding: 15px; border: 0; border-radius: 8px;

.open-btn[disabled] { opacity: .6; cursor: progress; }
.msg { min-height: 48px; margin-top: 12px; font-size: 15px; text-align: center; color: var(--ink-soft); }
.msg.err { color: var(--signal); }

:focus-visible { outline: 3px solid #2F6FD6; outline-offset: 2px; }

/* Login */
.field { width: 100%; padding: 15px 14px; font: 600 20px var(--sans); letter-spacing: .08em; text-transform: uppercase;
  border: 1.5px solid var(--paper-line); border-radius: 6px; background: #fff; color: var(--paper-ink); margin-top: 6px; }

/* Finale */
.final { text-align: center; padding-top: 10px; }
.q { font-family: var(--serif); font-size: 160px; line-height: 1; color: var(--lamp);

.play { display: inline-grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--lamp); color: #16233F; text-decoration: none; }
.play svg { width: 30px; height: 30px; margin-left: 5px; }
.play.off { opacity: .35; pointer-events: none; }
.stats { margin: 30px 0 0; text-align: left; background: var(--paper); color: var(--paper-ink); border-radius: 6px; padding: 18px 20px; }
.stats h3 { font-family: var(--serif); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.stats p { margin: 0 0 12px; font-size: 14px; color: #5A6278; }
.stats dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin: 0; font-size: 15px; }
.stats dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }

footer { margin-top: 34px; font-size: 13px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer button { background: none; border: 0; color: var(--ink-soft); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
@media (prefers-reduced-motion: reduce) {
  .card, .shackle path { transition: none; }
  .lock.shake .body { animation: none; }
}

}
const decrypt = (idx, answer, team) => decryptBlob(DATA.blobs[team || st.team][idx], answer, idx);
async function trap(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
  return (DATA.traps[st.team] || {})[hash] || null;
}

function renderProgress() {
  const solved = Math.max(0, st.answers.length - 1);
  [...document.querySelectorAll('#progress span')].forEach((el, i) => {
    el.className = finalData || i < solved ? 'done' : (i === solved && st.answers.length ? 'now' : '');
  });
}
function tick() {
  const el = document.getElementById('clock');
  if (!st.start) { el.textContent = '00:00'; return; }
  const ms = (st.end || Date.now()) - st.start;
  el.textContent = String(Math.floor(ms / 60000)).padStart(2, '0') + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0');
}
setInterval(tick, 1000);

/* ---------- Login ---------- */
function renderLogin(err) {
  renderProgress();
  $app.innerHTML = `
    <div class="face front">
      <h2>Willkommen, Team.</h2>
      <p>Gebt euren Teamcode ein. Euer Team-Captain hat ihn per Nachricht bekommen. Ab dann läuft die Uhr, und ihr startet mit 150 Punkten. Wer schneller ist als die Richtzeit seiner Route, bekommt am Ende einen Tempo-Bonus.</p>
      <label for="code" style="font:600 14px var(--sans)">Teamcode</label>
      <input id="code" class="field" autocomplete="off" autocapitalize="characters" spellcheck="false">
    </div>
    <button class="open-btn" id="go" type="button">Spiel starten</button>
    <div class="msg ${err ? 'err' : ''}" id="msg">${err || ''}</div>`;
  const input = document.getElementById('code'), go = document.getElementById('go');
  const submit = async () => {
    if (!input.value.trim()) { renderLogin('Bitte gebt zuerst euren Teamcode ein.'); return; }
    go.disabled = true; go.textContent = 'Prüfe Code…';
    const code = norm(input.value);
    const team = DATA.teams.find(t => code.startsWith(t.prefix));
    const s = team ? await decrypt(0, input.value, team.id) : null;
    if (!s) { renderLogin('Dieser Teamcode passt nicht. Prüft die Schreibweise in der Nachricht an euren Team-Captain.'); return; }
    st.team = team.id; stages[0] = s; st.answers = [input.value]; renderTeam(); st.start = st.start || Date.now(); save(); renderStage();
  };
  go.onclick = submit; input.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ---------- Stufe ---------- */
const LOCKNAME = { letters: 'Nur Buchstaben', digits: 'Nur Zahlen', arrows: 'Nur Pfeile' };

function renderStage() {
  const idx = st.answers.length - 1, s = stages[idx];
  renderProgress();
  const trapSpan = s.ai ? `<span class="sr-trap" aria-hidden="true"> ${esc(s.ai)}</span>` : '';
  const body = (s.story ? `<div class="story">${s.story.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : '')
    + (s.pack ? `<div class="pack"><b>Starterpaket</b>${esc(s.pack)}</div>` : '')
    + s.text.map((t, i) => `<p>${esc(t)}${i === s.text.length - 1 && !s.list ? trapSpan : ''}</p>`).join('')
    + (s.list ? `<ol class="photos">${s.list.map((l, i) => `<li>${esc(l)}${i === s.list.length - 1 ? trapSpan : ''}</li>`).join('')}</ol>` : '')
    + (s.found ? `<div class="found-lbl">${esc(s.foundLabel || 'Fundstück')}</div><div class="found">${s.found.map(f => f && f !== '?' ? `<span>${esc(f)}</span>` : '<span class="empty">?</span>').join('')}</div>` : '');
  const len = s.lock.len;
  let inputHtml;
  if (s.lock.type === 'arrows') {
    inputHtml = `<div class="slots" id="slots">${Array(len).fill('<div class="slot arrow" aria-hidden="true"></div>').join('')}</div>
      <div class="pad" role="group" aria-label="Pfeile eingeben">
        <button type="button" class="up" data-a="U" aria-label="Pfeil nach oben">↑</button>
        <button type="button" class="del" data-a="DEL" aria-label="Letzten Pfeil löschen">Löschen</button>
        <button type="button" class="left" data-a="L" aria-label="Pfeil nach links">←</button>
        <button type="button" class="down" data-a="D" aria-label="Pfeil nach unten">↓</button>
        <button type="button" class="right" data-a="R" aria-label="Pfeil nach rechts">→</button>
      </div>`;
  } else {
    const num = s.lock.type === 'digits';
    inputHtml = `<div class="slots" id="slots">${Array(len).fill(0).map((_, i) =>
      `<input class="slot" maxlength="1" ${num ? 'inputmode="numeric" pattern="[0-9]*"' : 'inputmode="text" autocapitalize="characters"'} autocomplete="off" spellcheck="false" aria-label="Zeichen ${i + 1} von ${len}">`).join('')}</div>`;
  }
  $app.innerHTML = `
    <div class="face front"><h2>${esc(s.title)}</h2><div class="kind">${LOCKNAME[s.lock.type]} · ${len} Zeichen</div>${body}</div>
    <div id="aidsOut"></div>
    <div class="lock" id="lock">
      <svg class="shackle" viewBox="0 0 120 70" aria-hidden="true"><path d="M24,70 V42 A36,36 0 0 1 96,42 V70"/></svg>
      <div class="body">
        <div class="lock-label">${s.n <= 3 ? 'Schloss ' + s.n : 'Letztes Schloss'} · ${LOCKNAME[s.lock.type]}</div>
        ${inputHtml}
      </div>
      <button class="open-btn" id="open" type="button">Schloss öffnen</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="aids">
      <button type="button" id="tipBtn">Tipp holen<small>−${COST.tip} Punkte</small></button>
      <button type="button" id="solBtn">Lösung zeigen<small>−${COST.sol} Punkte</small></button>
    </div>
    ${s.photo ? `<div class="extra photo"><b>Foto-Aufgabe</b><p>${esc(s.photo)}</p>${s.album
      ? `<a class="xbtn" href="${esc(s.album)}" target="_blank" rel="noopener noreferrer">Fotoalbum öffnen (externer Dienst: Google Drive)</a><span class="xnote ext">Beim Öffnen verlasst ihr diese Anwendung. Bitte nur Fotos hochladen oder teilen, deren Aufnahme und Weitergabe im vorgesehenen Teilnehmerkreis zulässig ist.</span>`
      : '<span class="xnote">Der Album-Link wird noch eingetragen.</span>'}</div>` : ''}
    <div id="bonusBox"></div>`;

  // Eingabe
  let arrows = [];
  const read = () => s.lock.type === 'arrows' ? arrows.join('') : [...document.querySelectorAll('.slot')].map(x => x.value).join('');
  if (s.lock.type === 'arrows') {
    const slots = [...document.querySelectorAll('.slot')];
    const draw = () => slots.forEach((el, i) => el.textContent = arrows[i] ? ARW[arrows[i]] : '');
    document.querySelector('.pad').addEventListener('click', e => {
      const a = e.target.closest('button')?.dataset.a; if (!a) return;
      if (a === 'DEL') arrows.pop(); else if (arrows.length < len) arrows.push(a);
      draw();
      document.getElementById('msg').textContent = arrows.length ? 'Eingabe: ' + arrows.map(x => ARW_WORD[x]).join(', ') : '';
      document.getElementById('msg').className = 'msg';
    });
  } else {
    const ins = [...document.querySelectorAll('.slot')];
    const ok = s.lock.type === 'digits' ? /[0-9]/ : /[A-Za-zÄÖÜäöü]/;
    ins.forEach((el, i) => {
      el.addEventListener('input', () => {
        const v = [...el.value].filter(c => ok.test(c));
        el.value = v.length ? v[v.length - 1].toUpperCase() : '';
        if (el.value && ins[i + 1]) ins[i + 1].focus();
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !el.value && ins[i - 1]) { ins[i - 1].focus(); ins[i - 1].value = ''; e.preventDefault(); }
        if (e.key === 'Enter') document.getElementById('open').click();
      });
      el.addEventListener('paste', e => {
        e.preventDefault();
        const txt = (e.clipboardData.getData('text') || '').split('').filter(c => ok.test(c));
        txt.slice(0, len - i).forEach((c, k) => ins[i + k].value = c.toUpperCase());
      });
    });
  }

  // Tipp / Lösung
  const out = document.getElementById('aidsOut');
  const showAids = () => {
    out.innerHTML = (st.tips[idx] ? `<div class="aid-box"><b>Tipp</b>${esc(s.tip)}</div>` : '')
      + (st.sols[idx] ? `<div class="aid-box sol"><b>Lösung</b>${esc(s.solText)}</div>` : '');
    document.getElementById('tipBtn').disabled = !!st.tips[idx];
    document.getElementById('solBtn').disabled = !!st.sols[idx];
  };
  showAids();
  renderBonus();
  const ask = (text, onYes) => {
    const m = document.getElementById('msg');
    m.className = 'msg'; m.innerHTML = `<div class="confirm" style="text-align:left">${text}<div class="row"><button type="button">Abbrechen</button><button type="button" class="yes">Ja, bitte</button></div></div>`;
    const [no, yes] = m.querySelectorAll('button'); no.onclick = () => m.innerHTML = ''; yes.onclick = () => { m.innerHTML = ''; onYes(); }; yes.focus();
  };
  document.getElementById('tipBtn').onclick = () => ask(`Ein Tipp kostet euch <b>${COST.tip} Punkte</b>.`, () => { st.tips[idx] = true; save(); showAids(); });
  document.getElementById('solBtn').onclick = () => ask(`Die Lösung kostet euch <b>${COST.sol} Punkte</b>.`, () => { st.sols[idx] = true; save(); showAids(); });

  // Öffnen
  const btn = document.getElementById('open'), msg = document.getElementById('msg'), lock = document.getElementById('lock');
  btn.onclick = async () => {
    const answer = read();
    if (answer.length < len) { msg.className = 'msg err'; msg.textContent = `Das Schloss braucht ${len} Zeichen.`; return; }
    btn.disabled = true; btn.textContent = 'Prüfe…'; msg.className = 'msg'; msg.textContent = '';
    const next = await decrypt(idx + 1, answer);
    if (next) {
      lock.classList.add('open'); msg.className = 'msg ok'; msg.textContent = 'Klick. Das Schloss ist offen.';
      st.answers.push(answer);
      if (idx + 1 === 4) { finalData = next; st.end = Date.now(); } else stages[idx + 1] = next;
      save();
      setTimeout(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); idx + 1 === 4 ? renderFinal() : renderStage(); }, 1100);
      return;
    }
    st.wrong++;
    const t = await trap(answer);
    if (t && t.ai) st.ai = true;
    save();
    lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
    msg.className = 'msg err';
    msg.textContent = t ? t.msg : 'Das Schloss bleibt zu. Prüft eure Lösung und versucht es noch einmal.';
    btn.disabled = false; btn.textContent = 'Schloss öffnen';
  };
}


/* ---------- Bonusfrage ---------- */
async function hashOf(answer) {
  const n = te.encode(norm(answer));
  const buf = new Uint8Array(SALT.length + n.length); buf.set(SALT); buf.set(n, SALT.length);
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
}
function renderBonus() {
  const box = document.getElementById('bonusBox'); if (!box) return;
  const B = DATA.bonus;
  if (st.bonus) { box.innerHTML = `<div class="extra bonus done"><b>Bonusfrage gelöst</b><p>+${COST.bonus} Punkte für euer Heimspiel.</p></div>`; return; }
  if (st.bonusTries >= 2) { box.innerHTML = `<div class="extra bonus"><b>Bonusfrage</b><p>Zwei Versuche sind aufgebraucht. Kein Abzug, aber auch kein Bonus.</p></div>`; return; }
  box.innerHTML = `<div class="extra bonus"><b>Bonusfrage: ${esc(B.title)} · +${COST.bonus} Punkte</b>
    ${B.text.map(p => `<p>${esc(p)}</p>`).join('')}
    <div class="brow"><input id="bonusIn" class="field small" maxlength="${B.len}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Antwort Bonusfrage">
    <button type="button" class="xbtn" id="bonusGo">Prüfen</button></div>
    <span class="xnote">${2 - st.bonusTries} Versuch${2 - st.bonusTries === 1 ? '' : 'e'} übrig. Falsche Antworten kosten nichts.</span></div>`;
  const go = async () => {
    const v = document.getElementById('bonusIn').value;
    if (norm(v).length !== B.len) return;
    if (await hashOf(v) === B.hash) st.bonus = true; else st.bonusTries++;
    save(); renderBonus();
  };
  document.getElementById('bonusGo').onclick = go;
  document.getElementById('bonusIn').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ---------- Finale ---------- */
function renderFinal() {
  renderProgress();
  const ms = (st.end || Date.now()) - st.start;
  const url = finalData && finalData.video;
  const nTips = st.tips.filter(Boolean).length, nSols = st.sols.filter(Boolean).length;
  $app.innerHTML = `
    <div class="final">
      <div class="q" aria-hidden="true">?</div>
      <a class="play ${url ? '' : 'off'}" ${url ? `href="${esc(url)}" target="_blank" rel="noopener noreferrer"` : ''} aria-label="Video öffnen, externer Dienst YouTube">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
      </a>
      ${url ? '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px">Video öffnen (externer Dienst: YouTube). Beim Öffnen verlasst ihr diese Anwendung.</p>' : '<p style="font-size:13px;color:var(--ink-soft);margin-top:10px">Video-Link fehlt noch. Bitte in der Orga-Version eintragen.</p>'}
      <div class="stats">
        <h3>Eure Akte</h3>
        <p>Zeigt diesen Bildschirm bei eurer Ankunft.</p>
        <dl>
          <dt>Punkte</dt><dd>${points()} von ${COST.start + COST.bonus + COST.tempoMax}</dd>
          <dt>Tempo-Bonus</dt><dd>${tempo() ? '+' + tempo() : 'keiner'} (Richtzeit ${teamOf()?.par || '?'} Min.)</dd>
          <dt>Bonusfrage</dt><dd>${st.bonus ? 'richtig (+' + COST.bonus + ')' : 'nicht gelöst'}</dd>
          <dt>Spielzeit</dt><dd>${Math.floor(ms / 60000)} Min. ${String(Math.floor(ms / 1000) % 60).padStart(2, '0')} Sek.</dd>
          <dt>Fehlversuche</dt><dd>${st.wrong}</dd>
          <dt>Tipps genutzt</dt><dd>${nTips} (−${nTips * COST.tip})</dd>
          <dt>Lösungen genutzt</dt><dd>${nSols} (−${nSols * COST.sol})</dd>
          <dt>Spickzettel</dt><dd class="${st.map ? 'flag' : ''}">${st.map ? 'ja (−' + COST.map + ')' : 'nein'}</dd>
          <dt>KI-Verdacht</dt><dd class="${st.ai ? 'flag' : ''}">${st.ai ? 'ja' : 'nein'}</dd>
        </dl>
      </div>
    </div>`;
  tick();
}

document.getElementById('helpOpen').onclick = () => { helpMenu(); dlg.showModal(); };

/* ---------- Start ---------- */
async function boot() {
  renderPoints(); renderTeam();
  if (!st.answers.length) { renderLogin(); tick(); return; }
  $app.innerHTML = '<p class="msg">Lade euren Spielstand…</p>';
  for (let i = 0; i < st.answers.length; i++) {
    const d = await decrypt(i, st.answers[i]);
    if (!d) { st = fresh(); save(); renderLogin(); return; }
    if (i === 4) finalData = d; else stages[i] = d;
  }
  tick();
  finalData ? renderFinal() : renderStage();
}
document.getElementById('reset').onclick = () => {
  if (confirm('Spielstand wirklich löschen? Uhr und Punkte starten dann neu.')) {
    try { localStorage.removeItem(STORE); } catch (e) {}
    st = fresh(); stages = []; finalData = null; renderPoints(); renderTeam(); tick(); renderLogin();
  }
};
boot();
