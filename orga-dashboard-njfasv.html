<title>Operation Lametta · Orga-Dashboard</title>
<style>
:root { --navy:#00358E; --gold:#FED210; --cream:#FFFFFF; --card:#FFFFFF; --line:rgba(195,195,195,.7); --ink:#00358E; --soft:rgba(0,53,142,.68); --ok:#43B02A; --warn:#008D92; --bad:#873FD5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --navy:#0C1C45; --cream:#030A1F; --card:#0C1C45; --line:rgba(195,195,195,.16); --ink:#FFFFFF; --soft:rgba(255,255,255,.68); --bad:#B07DF0; color-scheme: dark; } }
:root[data-theme="dark"] { --navy:#0C1C45; --cream:#030A1F; --card:#0C1C45; --line:rgba(195,195,195,.16); --ink:#FFFFFF; --soft:rgba(255,255,255,.68); --bad:#B07DF0; color-scheme: dark; }
.theme { margin-top:4px; font:600 12.5px system-ui,sans-serif; color:#fff; background:transparent; border:1.5px solid rgba(255,255,255,.5); border-radius:20px; padding:3px 10px; cursor:pointer; }
* { box-sizing:border-box; } body { margin:0; background:var(--cream); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
header { background:var(--navy); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
header img { width:34px; height:32px; background:#fff; border-radius:6px; padding:3px; }
header h1 { font:700 19px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; margin:0; } header .sub { color:rgba(255,255,255,.8); font-size:13px; }
header .right { margin-left:auto; text-align:right; } .clock { font:600 22px ui-monospace,Menlo,monospace; color:var(--gold); }
.conn { font-size:12.5px; } .conn.ok { color:#BAD71C; } .conn.bad { color:#FED210; } .conn.demo { color:var(--gold); }
main { max-width:1180px; margin:0 auto; padding:16px; }
.sum { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.sum div { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.sum b { display:block; font-size:24px; } .sum span { font-size:12.5px; color:var(--soft); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
.card .bar { height:6px; } .card .in { padding:12px 14px 14px; }
.top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.top h2 { font:700 19px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; margin:0; } .rt { font-size:12px; font-weight:700; color:#fff; padding:2px 7px; border-radius:5px; }
.pts { margin-left:auto; font-weight:700; font-size:18px; } .pts small { font-weight:500; color:var(--soft); font-size:12px; }
.now { margin:8px 0 10px; font-size:15px; } .now b { display:block; font-size:16.5px; }
.steps { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin-bottom:10px; }
.steps div { font-size:10.5px; text-align:center; color:var(--soft); }
.steps i { display:block; height:8px; border-radius:4px; background:rgba(195,195,195,.45); margin-bottom:3px; }
.steps .done i { background:var(--ok); } .steps .cur i { background:var(--gold); animation:pulse 1.6s infinite; } .steps .cur { color:var(--ink); font-weight:600; }
@keyframes pulse { 50% { opacity:.45; } }
.meta { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:13px; }
.meta span { color:var(--soft); } .plan.ok { color:var(--ok); } .plan.warn { color:var(--warn); } .plan.bad { color:var(--bad); font-weight:600; }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; } .chip { font-size:12px; border-radius:20px; padding:2px 9px; background:rgba(19,134,221,.10); }
.chip.red { background:rgba(135,63,213,.12); color:var(--bad); font-weight:600; }
.stale { font-size:12.5px; margin-top:8px; } .stale.warn { color:var(--warn); } .stale.bad { color:var(--bad); font-weight:600; }
.wait { opacity:.62; }
h3 { font:700 17px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif; margin:22px 0 8px; }
table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:14px; }
th, td { padding:8px 10px; text-align:left; border-top:1px solid var(--line); } th { background:rgba(19,134,221,.10); font-size:12px; text-transform:uppercase; letter-spacing:.06em; border-top:0; }
td i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }
.tools { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; font-size:13px; color:var(--soft); align-items:center; }
.tools button { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 12px; cursor:pointer; color:var(--ink); }
.tools button.danger { color:var(--bad); border-color:#873FD5; }
@media (max-width:640px) { .sum { grid-template-columns:repeat(2,1fr); } .grid { grid-template-columns:1fr; } }
</style></head><body>

<script>
const CFG = {"url": "https://lametta-7af1a-default-rtdb.europe-west1.firebasedatabase.app", "key": "cvtw5bjvr2ijxkrio0ci", "routes": {"A": {"name": "Altstadt", "color": "#00358E", "places": ["Römerberg, Gerechtigkeitsbrunnen", "Hauptwache", "Eschenheimer Turm", "Börse, Bulle und Bär"], "par": 73, "plan": [0, 17, 35, 52, 64, 68]}, "B": {"name": "Mainufer", "color": "#008D92", "places": ["Nizza-Uferanlage", "Holbeinsteg, Mitte der Brücke", "Goethehaus, Großer Hirschgraben", "Goetheplatz, Goethe-Denkmal"], "par": 69, "plan": [0, 13, 25, 48, 59, 64]}, "C": {"name": "Bankenviertel", "color": "#873FD5", "places": ["Main Tower", "Taunusanlage, Schiller-Denkmal", "Rothschildpark", "Opernplatz, Brunnen vor der Alten Oper"], "par": 67, "plan": [0, 17, 28, 48, 59, 62]}}, "teams": [{"id": "blau", "name": "Blau", "color": "#1386DD", "route": "A", "start": "16:40"}, {"id": "rot", "name": "Türkis", "color": "#008D92", "route": "B", "start": "16:40"}, {"id": "gruen", "name": "Grün", "color": "#43B02A", "route": "C", "start": "16:40"}, {"id": "gelb", "name": "Gelb", "color": "#FED210", "route": "A", "start": "16:50"}, {"id": "orange", "name": "Gelbgrün", "color": "#BAD71C", "route": "B", "start": "16:50"}, {"id": "lila", "name": "Violett", "color": "#873FD5", "route": "C", "start": "16:50"}]};
const root = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)');
try { const t = localStorage.getItem('lametta-theme'); if (t === 'light' || t === 'dark') root.dataset.theme = t; } catch (e) {}
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
const themeLabel = () => { document.getElementById('themeBtn').textContent = isDark() ? 'Ansicht: Hell' : 'Ansicht: Dunkel'; };
const DEMO = !CFG.url || new URLSearchParams(location.search).has('demo');
const STEP = ['Start', 'Schl. 1', 'Schl. 2', 'Schl. 3', 'Finale', 'Ziel'];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const fmt = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
let data = {}, lastOk = 0, demoT0 = Date.now();

function where(t, r, stage) {
  const p = r.places;
  return [['Noch nicht gestartet', 'Wartet auf Login'],
          ['Unterwegs zu Station 1', p[0] + ' · Schloss 1 (Buchstaben)'],
          ['Schloss 1 offen, unterwegs zu Station 2', p[1] + ' · Schloss 2 (Pfeile)'],
          ['Schloss 2 offen, Päckchen, Station 3', p[2] + ' · Schloss 3 (Zahlen)'],
          ['Schloss 3 offen, unterwegs zum Finale', p[3] + ' · LAMETTA'],
          ['Finale gelöst', 'Auf dem Weg zur Location']][stage];
}
function planStage(r, min) { let s = 1; r.plan.forEach((m, i) => { if (i && min >= m) s = i + 1; }); return Math.min(s, 5); }

function demoData() {
  const out = {}, now = Date.now(), speed = 20; // 1 Sekunde = 20 Sekunden Spielzeit
  CFG.teams.forEach((t, i) => {
    const r = CFG.routes[t.route], wave = t.start === CFG.teams[0].start ? 0 : 10;
    const min = (now - demoT0) / 1000 * speed / 60 + 25 - wave, f = [0.92, 1.08, 1.0, 1.15, 0.97, 1.25][i];
    if (min < 0) return;
    const stage = Math.min(5, planStage(r, min / f)), start = now - min * 60000;
    out[t.id] = { stage, start, end: stage >= 5 ? now - 60000 : 0, points: 0,
      photos: [2, 1, 2, 1, 1, 0][i], tips: [0, 1, 0, 1, 0, 2][i], sols: [0, 0, 1, 0, 0, 1][i], wrong: [1, 3, 0, 2, 1, 5][i], map: i === 5, ai: i === 3, bonus: !!(i % 2),
      updated: now - [20, 50, 30, 400, 15, 700][i] * 1000 };
    const o = out[t.id]; o.points = 150 + o.photos * 5 - o.tips * 10 - o.sols * 25 - (o.map ? 30 : 0) + (o.bonus ? 10 : 0);
  });
  return out;
}

async function load() {
  if (DEMO) { data = demoData(); lastOk = Date.now(); render(); return; }
  try {
    const res = await fetch(`${CFG.url}/live/${CFG.key}/teams.json`, { cache: 'no-store', credentials: 'omit' });
    if (!res.ok) throw new Error(res.status);
    data = (await res.json()) || {}; lastOk = Date.now();
  } catch (e) { $('conn').className = 'conn bad'; $('conn').textContent = 'Keine Verbindung zur Datenbank'; }
  render();
}

function render() {
  const now = Date.now();
  $('clock').textContent = fmt(now);
  if (DEMO) { $('conn').className = 'conn demo'; $('conn').textContent = 'Demo-Modus (erfundene Daten)'; }
  else if (lastOk) { $('conn').className = 'conn ok'; $('conn').textContent = 'Live · zuletzt ' + fmt(lastOk); }
  let started = 0, done = 0, behind = 0, silent = 0;
  const cards = CFG.teams.map(t => {
    const r = CFG.routes[t.route], d = data[t.id], stage = d ? Math.min(5, d.stage || 0) : 0;
    const min = d && d.start ? ((d.end || now) - d.start) / 60000 : 0;
    const [head, sub] = where(t, r, stage);
    let planTxt = '', planCls = 'ok', staleTxt = '', staleCls = '';
    if (d) {
      started++; if (stage >= 5) done++;
      const soll = planStage(r, min);
      if (stage < 5) {
        const due = r.plan[stage]; const late = Math.round(min - due);
        if (stage >= soll) { planTxt = 'im Plan'; } else { planTxt = late > 0 ? `${late} Min. hinter Plan` : 'knapp hinter Plan'; planCls = late > 10 ? 'bad' : 'warn'; behind++; }
        const age = Math.round((now - (d.updated || now)) / 60000);
        if (age >= 3) { staleTxt = `Letzte Meldung vor ${age} Min.` + (age >= 10 ? ' · Team anrufen?' : ''); staleCls = age >= 10 ? 'bad' : 'warn'; if (age >= 10) silent++; }
        else staleTxt = 'Meldet sich regelmäßig';
      } else { planTxt = Math.round(min) <= r.par ? `${Math.round(min)} Min., unter Richtzeit` : `${Math.round(min)} Min.`; }
    }
    const steps = STEP.map((s, i) => `<div class="${i < stage || stage === 5 ? 'done' : i === stage ? 'cur' : ''}"><i></i>${s}</div>`).join('');
    const chips = d ? [`${d.photos || 0}/4 Fotos`, `${d.tips || 0} Tipps`, `${d.sols || 0} Lösungen`, `${d.wrong || 0} Fehlversuche`].map(c => `<span class="chip">${c}</span>`).join('')
      + (d.map ? '<span class="chip">Spickzettel</span>' : '') + (d.bonus ? '<span class="chip">Bonus ✓</span>' : '') + (d.ai ? '<span class="chip red">KI-Verdacht</span>' : '') : '';
    return `<div class="card ${d ? '' : 'wait'}"><div class="bar" style="background:${t.color}"></div><div class="in">
      <div class="top"><h2>Team ${esc(t.name)}</h2><span class="rt" style="background:${r.color}">Route ${t.route} · ${esc(r.name)}</span>
        <div class="pts">${d ? d.points : '–'} <small>Pkt.</small></div></div>
      <div class="now"><b>${esc(head)}</b>${esc(sub)}</div>
      <div class="steps">${steps}</div>
      <div class="meta"><span>Start</span><div>${d && d.start ? fmt(d.start) : 'geplant ' + t.start}</div>
        <span>Spielzeit</span><div>${d ? Math.floor(min) + ' Min.' : '–'} <span>(Richtzeit ${r.par})</span></div>
        <span>Plan</span><div class="plan ${planCls}">${d ? planTxt : '–'}</div></div>
      ${d ? `<div class="chips">${chips}</div><div class="stale ${staleCls}">${staleTxt}</div>` : ''}
    </div></div>`;
  });
  $('grid').innerHTML = cards.join('');
  $('sum').innerHTML = `<div><b>${started}/${CFG.teams.length}</b><span>Teams gestartet</span></div><div><b>${done}</b><span>Finale gelöst</span></div>
    <div><b>${behind}</b><span>hinter Plan</span></div><div><b>${silent}</b><span>seit 10 Min. still</span></div>`;
  const rows = CFG.teams.map(t => ({ t, d: data[t.id] })).filter(x => x.d)
    .sort((a, b) => (b.d.points - a.d.points) || ((a.d.end || now) - a.d.start) - ((b.d.end || now) - b.d.start));
  $('rank').innerHTML = '<tr><th>#</th><th>Team</th><th>Stand</th><th>Punkte</th><th>Spielzeit</th></tr>' + (rows.length ? rows.map((x, i) =>
    `<tr><td>${i + 1}</td><td><i style="background:${x.t.color}"></i>${esc(x.t.name)}</td><td>${STEP[Math.min(5, x.d.stage || 0)]}</td><td><b>${x.d.points}</b></td><td>${Math.floor(((x.d.end || now) - x.d.start) / 60000)} Min.${x.d.end ? ' ✓' : ''}</td></tr>`).join('')
    : '<tr><td colspan="5">Noch keine Meldungen.</td></tr>');
}

$('refresh').onclick = load;
$('themeBtn').onclick = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; try { localStorage.setItem('lametta-theme', root.dataset.theme); } catch (e) {} themeLabel(); };
themeLabel(); try { mq.addEventListener('change', themeLabel); } catch (e) {}
$('wipe').onclick = async () => {
  if (DEMO) { alert('Im Demo-Modus gibt es nichts zu löschen.'); return; }
  if (!confirm('Wirklich alle Live-Daten löschen? Das betrifft nur das Dashboard, nicht die Handys.')) return;
  try { await fetch(`${CFG.url}/live/${CFG.key}/teams.json`, { method: 'DELETE', credentials: 'omit' }); } catch (e) {}
  load();
};
load(); setInterval(load, 5000); setInterval(render, 1000 * 30);
</script></body></html>
